# man_hours: 1.5
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atoms-vs-ashes"
version = "0.1.0"
description = "SMR Siting Assessment — Automated Site Evaluation System"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "click>=8.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "pyproj>=3.6",
    "shapely>=2.0",
    "rasterio>=1.3",
    "rich>=13.7",
    "anthropic>=0.42",
    "fiona>=1.9",
    "lxml>=5.0",
    "rapidfuzz>=3.0",
    "cdsapi>=0.7.7",
    "xarray>=2024.1",
    "netCDF4>=1.7",
    "scipy>=1.12",
]

[project.optional-dependencies]
earth_engine = [
    "earthengine-api>=1.7.3",
]
report_plots = [
    "matplotlib>=3.8",
]
report = [
    "python-docx>=1.1",
]
gui = [
    "streamlit>=1.30",
    "altair>=5.0",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "streamlit-keyup>=0.3",
    "pydeck>=0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
    "pydeck>=0.8",
]

[project.scripts]
atoms-vs-ashes = "atoms_vs_ashes.cli:main"
ava-client = "ava_client.cli:main"
atoms-gui = "atoms_vs_ashes.gui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: live API tests requiring network access (deselect with -m 'not smoke')",
    "slow: lint / publish-time checks (run via -m slow)",
]
