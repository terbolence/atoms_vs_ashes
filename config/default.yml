      plant_type: "thermal"
      status: "operating"
      subnational_unit: "Brăila"
      location: "Chișcani, Brăila County"
    - name: "FPCU Feldioara"
      country_code: "RO"
      country_name: "Romania"
      latitude: 45.7917
      longitude: 25.5889
      plant_type: "thermal"
      status: "operating"
      subnational_unit: "Brașov"
      location: "Feldioara, Brașov County"

screening:
  # Placeholder — populated when screening engine is implemented
  exclusionary: {}
  avoidance: {}

scoring:
  weights:
    natural_hazards: 0.25
    human_induced_hazards: 0.10
    radiological_impact: 0.15
    emergency_planning: 0.10
    infrastructure_grid: 0.15
    site_characteristics: 0.10
    socioeconomic_synergies: 0.15

cache:
  default_ttl_days: 30

retry:
  max_retries: 3
  base_delay_s: 2
  max_delay_s: 60

observability:
  alert_thresholds:
    overall_error_rate: 0.05
    connector_error_rate: 0.10
    site_coverage: 0.95
    criteria_coverage_per_site: 0.80
