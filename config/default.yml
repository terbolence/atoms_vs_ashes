# man_hours: 5.0
ingestion:
  # ISO 3166-1 alpha-2 codes for in-scope countries
  in_scope_countries:
    - PL   # Poland
    - CZ   # Czech Republic
    - SK   # Slovakia
    - HU   # Hungary
    - AT   # Austria
    - SI   # Slovenia
    - HR   # Croatia
    - BA   # Bosnia and Herzegovina
    - RS   # Serbia
    - ME   # Montenegro
    - XK   # Kosovo
    - AL   # Albania
    - MK   # North Macedonia
    - RO   # Romania
    - BG   # Bulgaria
    - MD   # Moldova
    - UA   # Ukraine
    - BY   # Belarus
    - EE   # Estonia
    - LV   # Latvia
    - LT   # Lithuania
    - AM   # Armenia
    - TR   # Turkey

  source_files:
    coal_tracker: "sources/global_coal_plant_tracker/Global-Coal-Plant-Tracker-January-2026.xlsx"
    coal_tracker_sheet: "Units"
    ownership_tracker: "sources/global_coal_plant_tracker/Global-Energy-Ownership-Tracker-February-2026-V1.xlsx"
    ownership_tracker_sheet: "Coal Plant Ownership"

  supplementary_sites:
    - name: "Brăila-Chișcani Thermal Power Plant"
      country_code: "RO"
      country_name: "Romania"
      latitude: 45.2744
      longitude: 27.9291
      plant_type: "thermal"
      status: "operating"
      subnational_unit: "Brăila"
      location: "Chișcani, Brăila County"
    - name: "FPCU Feldioara"
      country_code: "RO"
      country_name: "Romania"
      latitude: 45.7917
      longitude: 25.5889
      plant_type: "thermal"
      status: "operating"
      subnational_unit: "Brașov"
      location: "Feldioara, Brașov County"

screening:
  smr_types:
    oklo_aurora:
      name: "Oklo Aurora"
      capacity_mwe: 75
      land_ha: 22
    xe_100:
      name: "X-energy Xe-100"
      capacity_mwe: 80
      land_ha: 31
    bwrx_300:
      name: "GE Hitachi BWRX-300"
      capacity_mwe: 300
      land_ha: 25.3
    holtec_smr300:
      name: "Holtec SMR-300"
      capacity_mwe: 300
      land_ha: 38
    natrium_nominal:
      name: "TerraPower Natrium (nominal)"
      capacity_mwe: 345
      land_ha: 51
    nuscale_voygr6:
      name: "NuScale VOYGR-6"
      capacity_mwe: 462
      land_ha: 72.8
      reference: true
    rolls_royce_smr:
      name: "Rolls-Royce SMR"
      capacity_mwe: 470
      land_ha: 44.5
    natrium_peak:
      name: "TerraPower Natrium (peak)"
      capacity_mwe: 500
      land_ha: 51
  basic_filters:
    bf_01_grid_capacity:
      criterion_id: "BF-01"
      reference_smr: "nuscale_voygr6"
      pass_if: "any"
    bf_02_land_area:
      criterion_id: "BF-02"
      reference_smr: "nuscale_voygr6"
      pass_if: "any"
      nuclear_island_min_ha: 14
  exclusionary: {}
  avoidance: {}

  epz:
    radii_km: [5, 16, 25, 80]
    population_density_avoidance_threshold: 1000  # persons/km² within 5 km
    city_population_threshold: 50000
    ep01_fail_threshold: 30  # composite score 0–100

connectors:
  seismic_hazard:
    efehr_base_url: "http://appsrvr.share-eu.org:8080/share"
    efehr_model_name: "ESHM20"
    efehr_model_id: null              # auto-discovered if null; set to override
    gem_raster_dir: "sources/seismic/gem_global"
    timeout_s: 30
    inter_request_delay_s: 0.5
    cache_ttl_days: 365
    default_imt: "PGA"
    default_soil: "rock_vs30_800ms-1"
    return_periods:
      - poe: 0.1
        label: "475yr"
      - poe: 0.02
        label: "2475yr"
    spectral_periods:
      - "0.10s"
      - "0.20s"
      - "0.30s"
      - "0.50s"
      - "1.00s"
      - "2.00s"
  egdi_geology:
    wfs_base_url: "https://maps.europe-geology.eu/wfs/"
    wms_base_url: "https://maps.europe-geology.eu/wms/"
    wfs_version: "2.0.0"
    whoami: "atoms_vs_ashes@project.eu"
    timeout_s: 60
    inter_request_delay_s: 1.0
    cache_ttl_days: 180
    max_features_per_request: 1000
    layer_registry:
      faults:
        layer_name: "ms:hike_all_faults_layer"
        criteria: ["NH-02"]
        buffer_km: 8
      lithology:
        layer_name: "ms:egdi_surface_lithology_sandstone"
        criteria: ["NH-03", "NH-04"]
        buffer_km: 2
      mines:
        layer_names:
          - "ms:egdi_mines"
          - "ms:coalheritage"
        criteria: ["NH-05"]
        buffer_km: 10
      karst:
        layer_names:
          - "ms:pp05_cgs_karstified_zones"
          - "ms:pp07_gsi_karstifiedzones"
        criteria: ["NH-05"]
        buffer_km: 5
      hydrogeology:
        layer_names:
          - "ms:hydrogeologic_map_bgr_2019"
          - "ms:groundwater_bodies"
        criteria: ["NH-06", "RI-03"]
        buffer_km: 5
      boreholes:
        layer_name: "ms:egdi_geotech_boreholes"
        criteria: ["NH-06"]
        buffer_km: 5
  corine:
    rest_url: "https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer"
    rest_layer_id: 0
    wfs_url: "https://image.discomap.eea.europa.eu/arcgis/services/Corine/CLC2018_WM/MapServer/WFSServer"
    layer_name: "Corine:CLC2018_CLC2018_V2018_20"
    timeout_s: 30
  population:
    geonames_username: null  # optional; set for richer data
    overpass_url: "https://overpass-api.de/api/interpreter"
  osm:
    overpass_url: "https://overpass-api.de/api/interpreter"
    timeout_s: 120
    inter_request_delay_s: 1.0
    max_retries: 3
  protected_areas:
    wfs_url: "https://bio.discomap.eea.europa.eu/arcgis/services/ProtectedSites/Natura2000Sites/MapServer/WFSServer"
    layer_name: "Natura2000Sites:Natura2000polygon"
    wdpa_token: null  # optional; set for WDPA data

analysis:
  wildfire_context:
    buffer_radii_km: [5, 16, 25]
    high_combustibility_clc: ["311", "312", "313", "322", "324"]
    medium_combustibility_clc: ["321", "323", "243"]
  aviation_hazard:
    search_radius_km: 80
  military_proximity:
    search_radius_km: 25
  transmitter_proximity:
    search_radius_km: 25
  grid_proximity:
    search_radius_km: 50
    min_voltage_kv: 110
  population_projection:
    projection_horizon_years: 60
  coal_site_analysis:
    min_status: ["retired", "mothballed", "planned_closure"]
    smr_reference: "voygr6"

scoring:
  weights:
    natural_hazards: 0.25
    human_induced_hazards: 0.10
    radiological_impact: 0.15
    emergency_planning: 0.10
    infrastructure_grid: 0.15
    site_characteristics: 0.10
    socioeconomic_synergies: 0.15

llm:
  provider: anthropic
  api_key: null  # env: ANTHROPIC_API_KEY
  database_profile: llm  # connects to atoms_vs_ashes_llm
  models:
    tier1_exclusionary: claude-sonnet-4-20250514
    tier2_avoidance: claude-sonnet-4-20250514
    tier3_ranking: claude-haiku-3.5-20250401
  tier1_thinking_budget: 16384
  temperature: 0.0
  max_tokens: 4096
  max_tokens_tier1: 16384
  max_tokens_tier2: 4096
  max_tokens_tier3: 2048
  max_concurrent: 50
  rps: 40
  timeout_s: 120
  retry:
    max_retries: 3
    base_delay_s: 2
    max_delay_s: 60
  few_shot_examples: true

cache:
  default_ttl_days: 30

retry:
  max_retries: 3
  base_delay_s: 2
  max_delay_s: 60

observability:
  alert_thresholds:
    overall_error_rate: 0.05
    connector_error_rate: 0.10
    site_coverage: 0.95
    criteria_coverage_per_site: 0.80
