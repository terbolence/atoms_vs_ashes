# man_hours: 5.0
ingestion:
  # ISO 3166-1 alpha-2 codes for in-scope countries
  in_scope_countries:
    - PL   # Poland
    - CZ   # Czech Republic
    - SK   # Slovakia
    - HU   # Hungary
    - AT   # Austria
    - SI   # Slovenia
    - HR   # Croatia
    - BA   # Bosnia and Herzegovina
    - RS   # Serbia
    - ME   # Montenegro
    - XK   # Kosovo
    - AL   # Albania
    - MK   # North Macedonia
    - RO   # Romania
    - BG   # Bulgaria
    - MD   # Moldova
    - UA   # Ukraine
    - BY   # Belarus
    - EE   # Estonia
    - LV   # Latvia
    - LT   # Lithuania
    - AM   # Armenia
    - TR   # Turkey

  source_files:
    coal_tracker: "sources/global_coal_plant_tracker/Global-Coal-Plant-Tracker-January-2026.xlsx"
    coal_tracker_sheet: "Units"
    ownership_tracker: "sources/global_coal_plant_tracker/Global-Energy-Ownership-Tracker-February-2026-V1.xlsx"
    ownership_tracker_sheet: "Coal Plant Ownership"

  supplementary_sites:
    - name: "Brăila-Chișcani Thermal Power Plant"
      country_code: "RO"
      country_name: "Romania"
      latitude: 45.2744
      longitude: 27.9291
      plant_type: "thermal"
      status: "operating"
      subnational_unit: "Brăila"
      location: "Chișcani, Brăila County"
    - name: "FPCU Feldioara"
      country_code: "RO"
      country_name: "Romania"
      latitude: 45.7917
      longitude: 25.5889
      plant_type: "thermal"
      status: "operating"
      subnational_unit: "Brașov"
      location: "Feldioara, Brașov County"

screening:
  smr_types:
    oklo_aurora:
      name: "Oklo Aurora"
      capacity_mwe: 75
      land_ha: 22
    xe_100:
      name: "X-energy Xe-100"
      capacity_mwe: 80
      land_ha: 31
    bwrx_300:
      name: "GE Hitachi BWRX-300"
      capacity_mwe: 300
      land_ha: 25.3
    holtec_smr300:
      name: "Holtec SMR-300"
      capacity_mwe: 300
      land_ha: 38
    natrium_nominal:
      name: "TerraPower Natrium (nominal)"
      capacity_mwe: 345
      land_ha: 51
    nuscale_voygr6:
      name: "NuScale VOYGR-6"
      capacity_mwe: 462
      land_ha: 72.8
      reference: true
    rolls_royce_smr:
      name: "Rolls-Royce SMR"
      capacity_mwe: 470
      land_ha: 44.5
    natrium_peak:
      name: "TerraPower Natrium (peak)"
      capacity_mwe: 500
      land_ha: 51
  basic_filters:
    bf_01_grid_capacity:
      criterion_id: "BF-01"
      reference_smr: "nuscale_voygr6"
      pass_if: "any"
    bf_02_land_area:
      criterion_id: "BF-02"
      reference_smr: "nuscale_voygr6"
      pass_if: "any"
      nuclear_island_min_ha: 14
  exclusionary: {}
  avoidance: {}

  epz:
    radii_km: [5, 16, 25, 80]
    population_density_avoidance_threshold: 1000  # persons/km² within 5 km
    city_population_threshold: 50000
    ep01_fail_threshold: 30  # composite score 0–100

connectors:
  copernicus_dem:
    https_base_url: "https://copernicus-dem-30m.s3.eu-central-1.amazonaws.com"
    cache_dir: "sources/dem/copernicus_glo30"
    timeout_s: 60
    buffer_m: 5000                     # elevation stats buffer (metres)
    slope_buffer_m: 1000               # slope/TRI computation buffer (metres)
    cache_ttl_days: 365                # static dataset; annual updates
    use_local_cache: true              # prefer local tiles over remote COG reads
  seismic_hazard:
    efehr_base_url: "http://appsrvr.share-eu.org:8080/share"
    efehr_model_name: "ESHM20"
    efehr_model_id: null              # auto-discovered if null; set to override
    gem_raster_dir: "sources/seismic/gem_global"
    timeout_s: 30
    inter_request_delay_s: 0.5        # courtesy delay between API calls
    cache_ttl_days: 365
    default_imt: "PGA"
    default_soil: "rock_vs30_800ms-1"
    bbox_margin: 0.15                 # degrees; grid resolution ~0.1°
    return_periods:
      - poe: 0.1
        label: "475yr"
      - poe: 0.02
        label: "2475yr"
    spectral_periods:
      - "0.10s"
      - "0.20s"
      - "0.30s"
      - "0.50s"
      - "1.00s"
      - "2.00s"
    fetch_spectral_periods: false          # set true to query /curve for each SA(T) period (6 extra API calls/site)
  efsm20_faults:
    data_dir: "sources/efsm20"
    download_url: "https://seismofaults.eu/images/downloads/efsm20/EFSM20_GeoJSON.zip"
    wfs_url: "https://seismofaults.eu/geoserver/wfs"
    timeout_s: 30
    download_timeout_s: 600
    cache_ttl_days: 36500              # static model (EFSM20 released 2022); cache indefinitely
    search_radius_km: 50               # find faults within 50 km of each site
    e1_threshold_km: 8.0               # IAEA SSG-9 capable fault exclusion distance
    rupture_zone_buffer_km: 1.0        # conservative surface rupture zone estimate
    inter_request_delay_s: 0.5         # courtesy delay for WFS fallback queries
  onegeology:
    timeout_s: 30
    inter_request_delay_s: 1.0
    cache_ttl_days: 180
    max_features_per_request: 500
    fault_buffer_km: 8.0
    karst_buffer_km: 5.0
    # Curated national geological survey WFS endpoint registry.
    # Only countries with verified endpoints are listed; others default to S-02 EGDI only.
    # fault_layer / karst_layer values set to null until confirmed by GetCapabilities probe.
    endpoint_registry:
      PL:
        # Probed 2026-04-16: cbdgportal.pgi.gov.pl/geoserver/wfs → HTTP 404 (wrong path)
        # Correct base is ecoportal.pgi.gov.pl but also unreachable from current network.
        wfs_url: null
        wfs_version: "2.0.0"
        fault_layer: null
        karst_layer: null
      RO:
        # Probed 2026-04-16: inspire.igr.ro/geoserver/wfs → HTTP 200 but WFS service
        # is DISABLED on the server ("Service WFS is disabled"). GeoServer is running
        # but the WFS endpoint is administratively disabled. WMS also returns error.
        # Use null until service is re-enabled or alternative URL found.
        wfs_url: null
        wfs_version: "2.0.0"
        fault_layer: null
        karst_layer: null
      BG:
        # Probed 2026-04-16: inspire.geology.bg → DNS resolution failure.
        # Domain not reachable from current network.
        wfs_url: null
        wfs_version: "2.0.0"
        fault_layer: null
        karst_layer: null
      AT:
        # Probed 2026-04-16: gisgba.geologie.ac.at → DNS resolution failure.
        # GBA (Geologische Bundesanstalt) endpoint not reachable. Try geosphere.at.
        wfs_url: null
        wfs_version: "2.0.0"
        fault_layer: null
        karst_layer: null
      EE:
        # Probed 2026-04-16: xgis.maaamet.ee/xgis2/wfs → HTTP 404 (wrong path).
        # Maamet Land Board has a WFS but path is different. Needs re-verification.
        wfs_url: null
        wfs_version: "2.0.0"
        fault_layer: null
        karst_layer: null
      # Countries with unverified or unknown endpoints — left null until probed.
      # Per API exploration 2026-04-16: all 5 initially registered endpoints are
      # currently unreachable. S-03 connector gracefully skips and writes quality flags.
      # The EGDI WFS (S-02) remains the primary source; S-03 adds value when re-enabled.
  egdi_geology:
    wfs_base_url: "https://maps.europe-geology.eu/wfs/"
    wms_base_url: "https://maps.europe-geology.eu/wms/"
    wfs_version: "2.0.0"
    whoami: "atoms_vs_ashes@project.eu"
    timeout_s: 60
    inter_request_delay_s: 1.0
    cache_ttl_days: 180
    max_features_per_request: 1000
    max_retries: 1
    layer_registry:
      faults:
        layer_name: "ms:hike_all_faults_layer"
        criteria: ["NH-02"]
        buffer_km: 8
      lithology:
        layer_name: "ms:egdi_surface_lithology_sandstone"
        criteria: ["NH-03", "NH-04"]
        buffer_km: 2
      mines:
        layer_names:
          - "ms:egdi_mines"
          - "ms:coalheritage"
        criteria: ["NH-05"]
        buffer_km: 10
      karst:
        layer_names:
          - "ms:pp05_cgs_karstified_zones"
          - "ms:pp07_gsi_karstifiedzones"
        criteria: ["NH-05"]
        buffer_km: 5
      hydrogeology:
        layer_names:
          - "ms:hydrogeologic_map_bgr_2019"
          - "ms:groundwater_bodies"
        criteria: ["NH-06", "RI-03"]
        buffer_km: 5
      boreholes:
        layer_name: "ms:egdi_geotech_boreholes"
        criteria: ["NH-06"]
        buffer_km: 5
        enabled: false  # Layer returns HTTP 500 consistently (2026-04-13)
  soilgrids:
    cache_dir: "sources/soilgrids"
    cache_ttl_days: 36500
    min_request_interval_s: 3.0  # WCS endpoint; REST fair use is 5 req/min but WCS is more lenient
    timeout_s: 30
    wcs_base_url: "https://maps.isric.org/mapserv"
    batch:
      inter_request_delay_s: 3.0
      skip_already_enriched: true
  bdticm_bedrock:
    cache_ttl_days: 36500
    # No local download needed — uses /vsicurl/ remote sampling
    # Source: https://files.isric.org/soilgrids/former/2017-03-10/data/BDTICM_M_250m_ll.tif
  corine:
    rest_url: "https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer"
    rest_layer_id: 0
    wfs_url: "https://image.discomap.eea.europa.eu/arcgis/services/Corine/CLC2018_WM/MapServer/WFSServer"
    layer_name: "Corine:CLC2018_CLC2018_V2018_20"
    timeout_s: 30
    batch:
      inter_request_delay_s: 2.0
      skip_already_enriched: true
      buildable_radius_m: 1000
      ring_defs:
        - [0, 500, "0-500m"]
        - [500, 1000, "500m-1km"]
        - [1000, 2000, "1-2km"]
  worldcover:
    raster_dir: "sources/worldcover"
    s3_base_url: "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map"
    download_timeout_s: 600
    cache_ttl_days: 36500  # static dataset — cache indefinitely
  population:
    geonames_username: null  # optional; set for richer data
    overpass_url: "https://overpass-api.de/api/interpreter"
  osm:
    overpass_url: "https://overpass-api.de/api/interpreter"
    timeout_s: 120
    inter_request_delay_s: 1.0
    max_retries: 3
    transport_batch:
      queries_per_site: 3
      min_delay_between_queries_s: 5
      max_concurrent_overpass_slots: 2
      skip_already_enriched: true
      highway_search_radius_km: 10
      railway_search_radius_km: 15
      waterway_search_radius_km: 10
      cache_ttl_days: 30
  zhu_liquefaction:
    raster_dir: "sources/liquefaction"
    download_url: "https://zenodo.org/records/2583746/files/liquefaction_v1_deg.tif?download=1"
    download_timeout_s: 600
    cache_ttl_days: 36500              # static dataset; cache indefinitely
  wokam_karst:
    data_dir: "sources/karst/wokam"
    download_url: "https://download.bgr.de/bgr/grundwasser/whymap/shp/WHYMAP_WOKAM_v1.zip"
    download_timeout_s: 300
    cache_ttl_days: 36500              # static geological dataset (2017); cache indefinitely
  geonames_dump:
    base_url: "https://download.geonames.org/export/dump/"
    archive_name: "cities5000.zip"
    txt_name: "cities5000.txt"
    cache_dir: "sources/geonames"
    download_timeout_s: 120
    cache_ttl_days: 90
    min_population: 50000
    city_feature_class: "P"
  eurostat_gisco:
    gisco_base_url: "https://gisco-services.ec.europa.eu/distribution/v2"
    eurostat_api_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0"
    timeout_s: 120
    api_timeout_s: 30
    inter_request_delay_s: 0.5
    cache_dir: "sources/eurostat_gisco"
    cache_ttl_days: 180
    city_search_radius_km: 100
    city_min_population: 50000
  eurostat_projections:
    statistics_api_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0"
    timeout_s: 30
    inter_request_delay_s: 0.5           # courtesy delay between API calls
    cache_dir: "sources/eurostat_projections"
    projection_cache_ttl_days: 365       # EUROPOP published every ~4 years
    statistics_cache_ttl_days: 90        # annual updates
    nso_supplement_dir: "sources/nso_projections"
    national_projection_dataset: "proj_23np"
    national_indicators_dataset: "proj_23ndbi"
    projection_variant_primary: "BSL"
    projection_variant_lo: "LMIG"
    projection_variant_hi: "HMIG"
    projection_years:
      - 2030
      - 2040
      - 2050
      - 2060
      - 2070
      - 2080
    regional_projection_dataset: "proj_19rp3"
    regional_projection_years:
      - 2030
      - 2040
      - 2050
    datasets:
      demographics_age: "DEMO_R_PJANGRP3"
      demographics_growth: "DEMO_R_GIND3"
      gdp: "NAMA_10R_3GDP"
      gdp_per_capita: "NAMA_10R_3POPGDP"
      employment: "LFST_R_LFE2EN2N"
      unemployment: "LFST_R_LFU3RT"
      education: "EDAT_LFSE_04"
    statistics_reference_year: 2023
    indicators:
      - "MEDAGEPOP"
      - "OLDDEP"
      - "CNMIGRATRT"
      - "NATGROWRT"
      - "GROWRT"
    growth_thresholds:
      rapid_growth_min_pct: 5.0
      moderate_growth_min_pct: 1.0
      stable_band_pct: 1.0
      moderate_decline_max_pct: -1.0
    nuclear_policy:
      PL: "favourable"
      CZ: "favourable"
      SK: "favourable"
      HU: "favourable"
      AT: "unfavourable"
      SI: "neutral"
      HR: "neutral"
      BA: "unknown"
      RS: "neutral"
      ME: "unknown"
      XK: "unknown"
      AL: "unknown"
      MK: "unknown"
      RO: "favourable"
      BG: "favourable"
      MD: "unknown"
      UA: "favourable"
      BY: "favourable"
      EE: "neutral"
      LV: "neutral"
      LT: "neutral"
      AM: "favourable"
      TR: "favourable"
  ghsl_pop:
    raster_dir: "sources/population/ghsl"
    download_base_url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/"
    download_timeout_s: 1800           # 30 min; tiles can be large
    cache_ttl_days: 36500              # static dataset per release; cache indefinitely
    use_1km_resolution: false          # true = use 1 km global file (smaller); false = 100 m tiles
    primary_epoch: 2020
    projection_epoch: 2030
  protected_areas:
    wfs_url: "https://bio.discomap.eea.europa.eu/arcgis/services/ProtectedSites/Natura2000Sites/MapServer/WFSServer"
    layer_name: "Natura2000Sites:Natura2000polygon"
    wdpa_token: null  # optional; set for WDPA data
  natura2000:
    rest_url: "https://bio.discomap.eea.europa.eu/arcgis/rest/services/ProtectedSites/Natura2000Sites/MapServer"
    rest_layer_id: 2                             # Layer 2 = combined Habitats + Birds Directive
    wfs_url: "https://bio.discomap.eea.europa.eu/arcgis/services/ProtectedSites/Natura2000Sites/MapServer/WFSServer"
    layer_name: "Natura2000Sites:Natura2000polygon"
    timeout_s: 90                                # EEA service can be slow; 90s accommodates peak load
    inter_request_delay_s: 0.5
    cache_ttl_days: 90
    search_radius_m: 25000
    max_features: 5000
    epz_radii_m:
      - 5000
      - 16000
      - 25000
    avoidance_overlap: true
    avoidance_min_distance_km: 1.0
    eu_member_states:
      - PL
      - CZ
      - SK
      - HU
      - AT
      - SI
      - HR
      - RO
      - BG
      - EE
      - LV
      - LT
    sensitivity_thresholds:
      high_overlap: true
      high_within_1km: true
      moderate_min_sites_5km: 2
      moderate_min_area_fraction_5km: 0.10
      low_min_sites_25km: 1
  wdpa:
    api_url: "https://api.protectedplanet.net"
    api_version: "v4"
    api_token: null                               # required — free at https://api.protectedplanet.net/request
    timeout_s: 30
    inter_request_delay_s: 0.2
    per_page: 50
    cache_dir: "sources/wdpa"
    cache_ttl_days: 30
    search_radius_m: 25000
    max_areas_per_country: 10000
    epz_radii_m:
      - 5000
      - 16000
      - 25000
    iso3_mapping:
      PL: POL
      CZ: CZE
      SK: SVK
      HU: HUN
      AT: AUT
      SI: SVN
      HR: HRV
      BA: BIH
      RS: SRB
      ME: MNE
      XK: XKX
      AL: ALB
      MK: MKD
      RO: ROU
      BG: BGR
      MD: MDA
      UA: UKR
      BY: BLR
      EE: EST
      LV: LVA
      LT: LTU
      AM: ARM
      TR: TUR
    eu_member_states:
      - PL
      - CZ
      - SK
      - HU
      - AT
      - SI
      - HR
      - RO
      - BG
      - EE
      - LV
      - LT
    n2k_designation_patterns:
      - "Habitats Directive"
      - "Birds Directive"
      - "Natura 2000"
    bulk_download:
      cdn_base_url: "https://d1gam3xoknrgr2.cloudfront.net/current"
      timeout_s: 600                          # 10 min; large countries can be ~200 MB
    avoidance_overlap: true
    avoidance_iucn_ia_ib_buffer_km: 2.0
    avoidance_international_buffer_km: 2.0
    sensitivity_thresholds:
      high_overlap: true
      high_iucn_ia_ib_within_2km: true
      high_international_within_2km: true
      moderate_min_sites_5km: 2
      moderate_min_area_fraction_5km: 0.10
      moderate_ramsar_within_5km: true
      low_min_sites_25km: 1
    iucn_groups:
      strict: ["Ia", "Ib"]
      high: ["II", "III"]
      moderate: ["IV", "V", "VI"]
    international_designation_patterns:
      ramsar: "Ramsar"
      world_heritage: "World Heritage"
      biosphere: "Biosphere Reserve"
      emerald: "Emerald"
  hydrorivers:
    data_dir: "sources/hydrorivers"
    regions: ["eu", "as"]                  # EU covers most scope; AS covers Turkey, Armenia
    download_timeout_s: 1800               # 30 min; regional shapefiles ~150 MB each
    cache_ttl_days: 36500                  # static dataset (2019); cache indefinitely
    search_radius_km: 50                   # max distance to search for nearest river
    min_strahler_order: 3                  # min Strahler order for cooling viability
  wri_aqueduct:
    data_dir: "sources/wri_aqueduct"
    download_url: "https://files.wri.org/aqueduct/aqueduct-4-0-water-risk-data.zip"
    download_timeout_s: 600                # 10 min; ~400 MB download
    cache_ttl_days: 36500                  # static dataset (2023); cache indefinitely
  glofas_discharge:
    cache_dir: "sources/glofas_discharge"
    cache_ttl_days: 365                    # reanalysis dataset; annual refresh
    cds_url: null                          # uses default CDS API endpoint
    cds_key: null                          # env: CDS_API_KEY or ~/.cdsapirc
    years: [1991, 1995, 2000, 2005, 2010, 2015, 2020]  # sample years for climatology
    months: [1, 4, 7, 10]                  # quarterly sampling
    bbox:
      min_lat: 35
      max_lat: 60
      min_lon: 12
      max_lon: 50
  eu_flood_risk:
    glofas_base_url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-GLOFAS/flood_hazard"
    tile_extents_url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-GLOFAS/flood_hazard/tile_extents.geojson"
    return_periods: [10, 20, 50, 75, 100, 200, 500]
    download_reclass_tiles: false
    cache_dir: "sources/eu_flood_risk"
    glofas_cache_ttl_days: 365
    apsfr_cache_ttl_days: 180
    tile_download_timeout_s: 300
    apsfr_download_timeout_s: 600
    timeout_s: 60
    project_bbox:
      min_lat: 35
      max_lat: 60
      min_lon: 12
      max_lon: 45
    exclusion_depth_rp100_m: 0.5
    avoidance_depth_rp500_m: 0.0
  copernicus_ems:
    rrm_api_url: "https://riskandrecovery.emergency.copernicus.eu/api/public-activations/"
    rapid_api_url: "https://mapping.emergency.copernicus.eu/activations/api/activations/"
    geodata_cache_dir: "sources/copernicus_ems/geodata"
    timeout_s: 30
    download_timeout_s: 120
    inter_request_delay_s: 1.0
    cache_ttl_days: 180
    catalogue_refresh_days: 30
    site_buffer_km: 100                             # centroid-based proximity; 100 km captures flood event edges
    susceptibility_thresholds:
      high_intersection: true
      medium_distance_km: 10
      low_distance_km: 50
    categories:
      - "Flood"
      - "Storm"
  eea_industrial:
    esri_query_url: "https://air.discomap.eea.europa.eu/arcgis/rest/services/Air/IED_SiteMap/MapServer/0/query"
    cache_dir: "sources/eea_industrial"
    cache_ttl_days: 180
    timeout_s: 120
    search_radius_km: 30
    country_filter:
      - PL
      - CZ
      - SK
      - HU
      - AT
      - SI
      - HR
      - BG
      - RO
      - EE
      - LV
      - LT
      - RS
      - TR
  seveso:
    eea_api_base_url: "https://industry.eea.europa.eu/api"
    eea_api_inter_request_delay_s: 0.5
    eprtr_source: "local"
    eprtr_local_path: "sources/seveso/eprtr_facilities.csv"
    minerva_local_path: "sources/seveso/minerva_seveso.csv"
    national_data_dir: "sources/seveso/national"
    timeout_s: 30
    cache_ttl_days: 90
    max_search_radius_km: 25
    dedup_distance_threshold_m: 500
    dedup_name_similarity_threshold: 0.8
    distance_bands_km:
      - 2
      - 5
      - 10
      - 25
    epz_radii_km:
      - 5
      - 16
      - 25
    hazard_nace_codes:
      explosion:
        - "19.20"
        - "20.14"
        - "20.15"
        - "20.51"
        - "24.10"
        - "35.21"
      toxic:
        - "20.11"
        - "20.12"
        - "20.13"
        - "20.14"
        - "20.15"
        - "20.20"
        - "38.12"
        - "38.22"
      fire:
        - "19.20"
