# man_hours: 3.0
# EPRI / IAEA-aligned criterion weights (SP-B basis: "epri").
#
# Canonical source for the integer ``weight_factor`` values that the rubric
# YAMLs in ``config/scoring_rubrics/`` thread through ``weight_factors.epri``
# (see ``src/atoms_vs_ashes/scoring/rubric.py`` ``_resolve_basis_weight``).
#
# Source documents (transcribed and reconciled in
# ``docs/expert_siting_criteria_evaluation_matrix.md`` § Summary table):
#   - EPRI 3002023910 (2022) "Advanced Nuclear Technology: Site Selection and
#     Evaluation Criteria for New Nuclear Energy Generation Facilities" - mapped
#     in ``report/regulations/epri/maps/EPRI-SitingGuide_map.md``.
#   - IAEA SSG-35 "Site Survey and Site Selection for Nuclear Installations"
#     Tables I-1 / II-1 and §3.8 / §4.x, mapped under
#     ``report/regulations/iaea/maps/``.
#   - Per-criterion normative basis cited inline in
#     ``docs/expert_siting_criteria_evaluation_matrix.md`` § <criterion id>.
#
# Methodology:
#   The matrix doc reports per-criterion weight as a percent (Σ = 100 %).
#   The integer weight_factor below is derived by ``round(weight_pct × 10 / 4.7)``
#   (the multiplier maps the largest EPRI weight - NS-01 / NS-02 at 4.7 % - onto
#   the maximum integer factor of 10 while preserving relative ratios). Because
#   ``weight_normalisation`` re-normalises over composite-participating criteria,
#   small integer rounding noise (<5 percentage points per criterion vs source)
#   does not change ranking shape materially. The baseline-vs-EPRI side-by-side
#   delta is generated by ``src/scripts/build_epri_weights_artefact.py`` into
#   ``audit/post_processing/epri_weights/``.
#
# Exclusionary criteria (NH-02, NH-03, NH-04, NH-07, NH-10, NS-01, NS-08, EP-01)
# still carry an EPRI weight here for completeness, but the engine's
# ``participates_in_composite`` gate keeps them out of the ranking-composite
# denominator. The EPRI matrix records the same "screen + rank" status.

basis: epri
source:
  primary: docs/expert_siting_criteria_evaluation_matrix.md
  primary_section: "§ Summary table (refresh 2026-04-21)"
  citations:
    - EPRI 3002023910 (2022) - Site Selection and Evaluation Criteria for New Nuclear Energy Generation Facilities
    - IAEA SSG-35 - Site Survey and Site Selection for Nuclear Installations (Tables I-1 / II-1)
  maps:
    - report/regulations/epri/maps/EPRI-SitingGuide_map.md
    - report/regulations/iaea/maps/SSG-35_map.md

