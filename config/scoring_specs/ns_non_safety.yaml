# man_hours: 6.5
# Non-safety (NS) scoring rubric. Source: report/sites_evaluation/07_criteria_non_safety.md.
# Phase: basic_filter|exclusionary|avoidance|ranking. fail_conditions.action: exclude|avoidance_penalty|screen_flag|review_flag.
family: ns
pass_mark_default: 5.0
criteria:
  - criterion_id: NS-01
    name: Cooling water / ultimate heat sink
    phases: [avoidance, ranking]
    weight_factor: 8
    normalised_weight_pct: 2.8
    weight_factors: {baseline: 8, epri: 10}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-01 (SSG-35 §4.9; EPRI Steps 2-3 cooling water; A16)"}
    db_fields: {api: [site_infrastructure_v2.cooling_source_type, site_infrastructure_v2.cooling_source_name, site_infrastructure_v2.cooling_source_hyriv_id, site_infrastructure_v2.cooling_distance_km, site_infrastructure_v2.cooling_flow_m3s, site_infrastructure_v2.water_stress_score, site_infrastructure_v2.water_stress_label], llm: ns01_cooling_text}
    aggregation: {method: weighted_mean_of_sub_scores, round_to: 1}
    notes: |
      LL-036: the prior E9 hard fail (``cooling_source_type in ['none', null]
      and dry_cooling_viable == false``) was structurally unreachable.
      ``cooling_source_type`` is populated only by the HydroRIVERS connector
      and is always one of ``{major_river, river, small_river}`` (361/361
      sites in the merged DB); ``dry_cooling_viable`` was not in the scoring
      context. Replaced with the A16 avoidance penalty so the cooling-water
      risk is still surfaced as ``caution`` without an impossible exclusion.

      Sub-score taxonomy aligns with the connector vocabulary:
      ``{major_river, river, small_river, stream}`` plus
      ``cooling_source_type is null`` interpreted as "no source within the
      50 km HydroRIVERS search radius". ``strahler_order`` was dropped
      because it is not persisted as a DB column (HydroRIVERS only records
      it in the observation comment).

      Seasonal-drought sub-score (D, ``spi12_min``, 20 % weight) was
      removed because the ERA5/SPEI connector that would populate
      ``site_natural_hazards.spi12_min`` does not exist yet. Tracked as
      IMP-0007 in IMPROVEMENTS.md. Remaining A / B / C weights re-normalised
      from 0.35 / 0.20 / 0.25 to 0.44 / 0.25 / 0.31.

      ``dry_cooling_viable`` is now derived in
      ``merge_context_derivations._derive_dry_cooling_viable``:
      ``country_code in ARID_OR_HOT_SUMMER_ISO2 and
      water_stress_label == 'Extremely High'`` ⇒ False; otherwise True.
      Used only by the source-type sub-score 0-band (degenerate case).
    sub_scores:
      - key: source_type
        weight: 0.44
        primary_metric: cooling_source_type
        bands:
          - {score_range: [9, 10], condition_expr: "cooling_source_type == 'major_river'", descriptor: "Major river (HydroRIVERS major_river class: discharge >= 100 m³/s or Strahler >= 6)."}
          - {score_range: [7, 8], condition_expr: "cooling_source_type == 'river'", descriptor: "River (HydroRIVERS river class: Strahler 4-5)."}
          - {score_range: [5, 6], condition_expr: "cooling_source_type == 'small_river'", descriptor: "Small river (HydroRIVERS small_river class: Strahler 3)."}
          - {score_range: [3, 4], condition_expr: "cooling_source_type == 'stream'", descriptor: "Stream (HydroRIVERS stream class: Strahler 1-2); cooling tower or dry/hybrid cooling likely required."}
          - {score_range: [1, 2], condition_expr: "cooling_source_type is null and (cooling_distance_km is null or cooling_distance_km > 10)", descriptor: "No HydroRIVERS source within 10 km; dry/hybrid cooling required."}
          - {score_range: [0, 0], condition_expr: "cooling_source_type is null and dry_cooling_viable == false", descriptor: "No HydroRIVERS source AND dry cooling not viable (arid country with extremely-high water stress)."}
      - key: distance_to_source
        weight: 0.25
        primary_metric: cooling_distance_km
        bands:
          - {score_range: [9, 10], condition_expr: "cooling_distance_km < 0.5", descriptor: "< 0.5 km."}
          - {score_range: [7, 8], condition_expr: "cooling_distance_km < 2", descriptor: "0.5-2 km."}
          - {score_range: [5, 6], condition_expr: "cooling_distance_km < 5", descriptor: "2-5 km."}
          - {score_range: [3, 4], condition_expr: "cooling_distance_km <= 10", descriptor: "5-10 km; routing/pumping penalty, not exclusionary by itself."}
          - {score_range: [1, 2], condition_expr: "cooling_distance_km > 10", descriptor: "> 10 km; severe distance penalty, not exclusionary by itself."}
      - key: water_stress
        weight: 0.31
        primary_metric: water_stress_label
        bands:
          - {score_range: [9, 10], condition_expr: "water_stress_label == 'Low'", descriptor: "WRI Aqueduct baseline label: Low."}
          - {score_range: [7, 8], condition_expr: "water_stress_label == 'Low-Medium'", descriptor: "WRI Aqueduct baseline label: Low-Medium."}
          - {score_range: [5, 6], condition_expr: "water_stress_label == 'Medium-High'", descriptor: "WRI Aqueduct baseline label: Medium-High."}
          - {score_range: [3, 4], condition_expr: "water_stress_label == 'High'", descriptor: "WRI Aqueduct baseline label: High; ranking penalty, not exclusionary by itself."}
          - {score_range: [1, 2], condition_expr: "water_stress_label == 'Extremely High'", descriptor: "WRI Aqueduct baseline label: Extremely High; severe ranking penalty, not exclusionary by itself."}
    fail_conditions:
      - {code: A16, action: avoidance_penalty, condition_expr: "cooling_distance_km > 10 and water_stress_label in ['High', 'Extremely High']", descriptor: "Cooling source > 10 km AND WRI Aqueduct water stress High / Extremely High; flag for cooling-tower or dry/hybrid cooling design review (SSG-35 §4.9 ultimate-heat-sink characterisation)."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-02
    name: Grid connection (detailed)
    phases: [avoidance, ranking]
    weight_factor: 8
    normalised_weight_pct: 2.8
    weight_factors: {baseline: 8, epri: 10}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-02 (EPRI Steps 2-3 grid interconnection; project A13)"}
    db_fields: {api: [site_infrastructure_v2.nearest_substation_km, site_infrastructure_v2.nearest_hv_line_km, site_infrastructure_v2.hv_line_voltage_kv, site_infrastructure_v2.grid_export_capacity_mw], llm: ns02_grid_text}
    aggregation: {method: min_of_sub_scores}
    notes: |
      A13 Option A aligns the capacity-margin score ladder with the
      avoidance floor: score 5-6 begins at the 462 MW reference VOYGR-6
      net export threshold, while values below 462 MW remain below the
      pass mark and still trigger the A13 caution verdict.
    bands:
      - {score_range: [9, 10], condition_expr: "grid_export_capacity_mw >= 646.8", descriptor: "Grid headroom at least 40% above export need."}
      - {score_range: [7, 8], condition_expr: "grid_export_capacity_mw >= 554.4", descriptor: "Meets the preferred 20% export-capacity margin."}
      - {score_range: [5, 6], condition_expr: "grid_export_capacity_mw >= 462.0", descriptor: "Meets the A13 hard floor with limited export-capacity margin."}
      - {score_range: [3, 4], condition_expr: "grid_export_capacity_mw >= 369.6", descriptor: "Below the A13 hard floor but within 20% of the export need."}
      - {score_range: [1, 2], condition_expr: "grid_export_capacity_mw > 0", descriptor: "Some export path exists but is materially undersized."}
      - {score_range: [0, 0], condition_expr: "grid_export_capacity_mw <= 0 or grid_export_capacity_mw is null", descriptor: "No usable export capacity."}
    sub_scores:
      - key: distance_to_grid
        primary_metric: nearest_hv_line_km
        bands:
          - {score_range: [9, 10], condition_expr: "nearest_hv_line_km < 1", descriptor: "< 1 km."}
          - {score_range: [7, 8], condition_expr: "nearest_hv_line_km <= 5", descriptor: "1-5 km."}
          - {score_range: [5, 6], condition_expr: "nearest_hv_line_km <= 15", descriptor: "5-15 km."}
          - {score_range: [3, 4], condition_expr: "nearest_hv_line_km <= 30", descriptor: "15-30 km."}
          - {score_range: [1, 2], condition_expr: "nearest_hv_line_km > 30", descriptor: "> 30 km."}
      - key: voltage_class
        primary_metric: hv_line_voltage_kv
        bands:
          - {score_range: [9, 10], condition_expr: "hv_line_voltage_kv >= 400", descriptor: ">= 400 kV."}
          - {score_range: [7, 8], condition_expr: "hv_line_voltage_kv >= 220", descriptor: "220-399 kV."}
          - {score_range: [5, 6], condition_expr: "hv_line_voltage_kv >= 110", descriptor: "110-219 kV."}
          - {score_range: [3, 4], condition_expr: "hv_line_voltage_kv >= 33", descriptor: "33-109 kV."}
          - {score_range: [1, 2], condition_expr: "hv_line_voltage_kv < 33", descriptor: "< 33 kV or unknown."}
    fail_conditions:
      - {code: A13, action: avoidance_penalty, condition_expr: "grid_export_capacity_mw < 462", descriptor: "Project A13: transmission >= reference SMR net MWe within feasible distance."}
    band_recipe: {kind: capacity_margin, fail_code: A13}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-03
    name: Transport access (heavy haul road / rail / port)
    phases: [avoidance, ranking]
    weight_factor: 8
    normalised_weight_pct: 2.8
    weight_factors: {baseline: 8, epri: 10}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-03 (EPRI Steps 2-3 transport; project A14; vendor logistics)"}
    db_fields: {api: [site_infrastructure_v2.nearest_highway_km, site_infrastructure_v2.nearest_rail_km, site_infrastructure_v2.nearest_waterway_km, site_infrastructure_v2.heavy_haul_capable], llm: ns03_transport_text}
    aggregation: {method: weighted_mean_of_sub_scores, round_to: 1}
    sub_scores:
      - key: road
        weight: 0.50
        primary_metric: nearest_highway_km
        bands:
          - {score_range: [9, 10], condition_expr: "nearest_highway_km < 2", descriptor: "< 2 km."}
          - {score_range: [7, 8], condition_expr: "nearest_highway_km <= 10", descriptor: "2-10 km."}
          - {score_range: [5, 6], condition_expr: "nearest_highway_km <= 25", descriptor: "10-25 km."}
          - {score_range: [3, 4], condition_expr: "nearest_highway_km <= 50", descriptor: "25-50 km."}
          - {score_range: [1, 2], condition_expr: "nearest_highway_km > 50", descriptor: "> 50 km."}
      - key: rail
        weight: 0.30
        primary_metric: nearest_rail_km
        bands:
          - {score_range: [9, 10], condition_expr: "nearest_rail_km < 1", descriptor: "< 1 km."}
          - {score_range: [7, 8], condition_expr: "nearest_rail_km <= 5", descriptor: "1-5 km."}
          - {score_range: [5, 6], condition_expr: "nearest_rail_km <= 15", descriptor: "5-15 km."}
          - {score_range: [3, 4], condition_expr: "nearest_rail_km <= 30", descriptor: "15-30 km."}
          - {score_range: [1, 2], condition_expr: "nearest_rail_km > 30", descriptor: "> 30 km."}
      - key: waterway
        weight: 0.20
        primary_metric: nearest_waterway_km
        bands:
          - {score_range: [9, 10], condition_expr: "nearest_waterway_km < 2", descriptor: "< 2 km."}
          - {score_range: [7, 8], condition_expr: "nearest_waterway_km <= 10", descriptor: "2-10 km."}
          - {score_range: [5, 6], condition_expr: "nearest_waterway_km <= 30", descriptor: "10-30 km."}
          - {score_range: [3, 4], condition_expr: "nearest_waterway_km <= 75", descriptor: "30-75 km."}
          - {score_range: [1, 2], condition_expr: "nearest_waterway_km > 75", descriptor: "> 75 km / no navigable waterway."}
    fail_conditions:
      - {code: A14, action: avoidance_penalty, condition_expr: "heavy_haul_capable == false", descriptor: "Project A14: heavy-haul access >= 700 t segment capacity."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-04
    name: Site topography / grading
    phases: [ranking]
    weight_factor: 6
    normalised_weight_pct: 2.1
    weight_factors: {baseline: 6, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-04 (SSG-35 Table I-1 (topography / grading))"}
    primary_metric: favourable_land_pct
    db_fields: {api: [site_infrastructure_v2.favourable_land_pct, site_infrastructure_v2.favourable_area_ha, site_infrastructure_v2.favourable_area_method], llm: ns04_topography_text}
    bands:
      - {score_range: [9, 10], condition_expr: "favourable_land_pct > 80", descriptor: "> 80 %."}
      - {score_range: [7, 8], condition_expr: "favourable_land_pct >= 60", descriptor: "60-80 %."}
      - {score_range: [5, 6], condition_expr: "favourable_land_pct >= 40", descriptor: "40-60 %."}
      - {score_range: [3, 4], condition_expr: "favourable_land_pct >= 20", descriptor: "20-40 %."}
      - {score_range: [1, 2], condition_expr: "favourable_land_pct < 20", descriptor: "< 20 %."}
    fail_conditions:
      - {code: sanity_task2, action: review_flag, condition_expr: "favourable_area_ha < 1.0 and site_area_ha > 50", descriptor: "Curation Task 2 sanity: trigger hypothesis-based review (water dominated / DEM overwrite / mid-river / unknown)."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-05
    name: Land availability / ownership / zoning
    phases: [avoidance, ranking]
    weight_factor: 5
    normalised_weight_pct: 1.8
    weight_factors: {baseline: 5, epri: 5}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-05 (EPRI Steps 2-3 land use; project A15)"}
    primary_metric: site_area_ha
    db_fields: {api: [sites.site_area_ha, site_infrastructure_v2.favourable_area_ha, site_infrastructure_v2.favourable_area_method, site_infrastructure_v2.patch_count], llm: ns05_land_text}
    notes: |
      NS-05/A15 uses ``sites.site_area_ha`` as the sole scoring and
      avoidance indicator. ``favourable_area_ha`` is retained as report
      context only: it describes the larger expansion envelope that may
      support laydown or future site expansion, but it must not rescue a
      site whose canonical ``site_area_ha`` is below the A15 minimum.
    bands:
      - {score_range: [9, 10], condition_expr: "site_area_ha >= 72.8", descriptor: "Canonical site area meets the full VOYGR-6 reference footprint."}
      - {score_range: [7, 8], condition_expr: "site_area_ha >= 40", descriptor: "Canonical site area exceeds the nuclear-island minimum with meaningful balance-of-plant margin."}
      - {score_range: [5, 6], condition_expr: "site_area_ha >= 14", descriptor: "Canonical site area meets the A15 nuclear-island minimum."}
      - {score_range: [3, 4], condition_expr: "site_area_ha >= 8", descriptor: "Canonical site area is below A15 but not extremely constrained."}
      - {score_range: [1, 2], condition_expr: "site_area_ha > 0", descriptor: "Canonical site area is materially below A15."}
      - {score_range: [0, 0], condition_expr: "site_area_ha <= 0 or site_area_ha is null", descriptor: "No verified canonical site area."}
    fail_conditions:
      - {code: A15, action: avoidance_penalty, condition_expr: "site_area_ha < 14", descriptor: "Project A15: >= 14 ha canonical site area."}
    band_recipe: {kind: higher_is_better, fail_code: A15, metric: site_area_ha}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-06
    name: Existing infrastructure reuse
    phases: [ranking]
    weight_factor: 5
    normalised_weight_pct: 1.8
    weight_factors: {baseline: 5, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-06 (DOE coal-to-nuclear transitions guidance; EPRI Step 3 engineering)"}
    primary_metric: reuse_tier
    db_fields: {api: [], llm: ns06_reuse_text}
    bands:
      - {score_range: [9, 10], condition_expr: "reuse_tier == 'strong'", descriptor: "Strong civil + grid + cooling reuse; minimal demolition."}
      - {score_range: [7, 8], condition_expr: "reuse_tier == 'solid'", descriptor: "Solid grid + cooling reuse; civil partially."}
      - {score_range: [5, 6], condition_expr: "reuse_tier == 'moderate'", descriptor: "Moderate reuse; one major asset class transferable."}
      - {score_range: [3, 4], condition_expr: "reuse_tier == 'limited'", descriptor: "Limited reuse; greenfield-equivalent."}
      - {score_range: [1, 2], condition_expr: "reuse_tier == 'contaminated'", descriptor: "Legacy assets contaminated or beyond useful life."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-07
    name: Environmental impact (non-radiological)
    phases: [avoidance, ranking]
    weight_factor: 5
    normalised_weight_pct: 1.8
    weight_factors: {baseline: 5, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-07 (SSG-35 §4.9; EPRI Step 3 environmental)"}
    primary_metric: env_impact_tier
    db_fields: {api: [site_infrastructure_v2.env_impact_tier], llm: ns07_env_impact_text}
    notes: |
      NS-07 intentionally remains a Screen + Rank criterion with no A-code.
      The ranking pivot is the persisted categorical ``env_impact_tier`` field,
      populated by the NS-07 LLM schema / persistence path. Free-text
      ``env_impact_notes`` is retained as supporting evidence only and is not
      interpreted as a band by the scoring engine.
    bands:
      - {score_range: [9, 10], condition_expr: "env_impact_tier == 'industrial'", descriptor: "Industrial / agricultural setting; favourable thermal-discharge headroom."}
      - {score_range: [7, 8], condition_expr: "env_impact_tier == 'few_sensitivities'", descriptor: "Few sensitivities; standard EIA path."}
      - {score_range: [5, 6], condition_expr: "env_impact_tier == 'typical'", descriptor: "Typical conversion challenges."}
      - {score_range: [3, 4], condition_expr: "env_impact_tier == 'significant'", descriptor: "Significant EIA issues; mitigation costly."}
      - {score_range: [1, 2], condition_expr: "env_impact_tier == 'showstopper_risk'", descriptor: "Iconic landscape or strict thermal cap; EIA showstopper risk."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-08
    name: Ecological sensitivity (Natura 2000 / WDPA)
    phases: [exclusionary, ranking]
    weight_factor: 6
    normalised_weight_pct: 2.1
    weight_factors: {baseline: 6, epri: 5}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-08 (SSG-35 Table II-1; EU Natura 2000 / WDPA; E7)"}
    primary_metric: n2k_nearest_distance_km
    db_fields: {api: [site_infrastructure_v2.n2k_nearest_distance_km, site_infrastructure_v2.wdpa_nearest_distance_km, site_infrastructure_v2.ecological_natural_pct, site_infrastructure_v2.n2k_overlap, site_infrastructure_v2.wdpa_overlap, site_infrastructure_v2.n2k_sensitivity_class, site_infrastructure_v2.wdpa_sensitivity_class, site_infrastructure_v2.n2k_result_json, site_infrastructure_v2.wdpa_result_json], llm: ns08_ecology_text}
    notes: |
      E7 strict-overlap derivation (see merge_context_derivations._derive_ns08_strictness):
        site_within_strict_protected = True iff
          (a) n2k_overlap == True  (any Natura 2000 polygon overlap;
                                    EU SPA/SAC are uniformly exclusionary
                                    under the Habitats / Birds Directives), OR
          (b) wdpa_overlap == True AND wdpa_strictest_iucn_category
                                       in {'Ia', 'Ib', 'II'}, OR
          (c) wdpa_overlap == True AND wdpa_international_designation_count > 0
              (Ramsar / World Heritage / Biosphere / Emerald polygon overlap).

      WDPA IUCN III / IV / V / VI polygon overlaps are NOT exclusionary
      (managed-resource categories with documented human-use intent).
      They surface via R1 review_flag instead, never silently as E7.

      NULL semantics (matches NH-07 LL-033):
        n2k_nearest_distance_km IS NULL  -> Natura 2000 connector ran and
                                            found no SPA/SAC within its
                                            25 km search radius. Positive
                                            evidence; scores upper bands.
        wdpa_nearest_distance_km IS NULL -> WDPA connector ran and found
                                            no protected area within its
                                            25 km search radius. Positive
                                            evidence; scores upper bands.

      Report-writer contract: NULL distance columns must be surfaced in
      the site description (e.g. "no Natura 2000 / WDPA evidence within
      the 25 km screening radius"). The score does not encode data
      sparsity; that signal lives in the DB rows directly.
    bands:
      - {score_range: [9, 10], condition_expr: "(n2k_nearest_distance_km is null or n2k_nearest_distance_km > 25) and (wdpa_nearest_distance_km is null or wdpa_nearest_distance_km > 25) and (ecological_natural_pct is null or ecological_natural_pct < 15)", descriptor: "Both networks NULL or > 25 km AND eco_pct NULL or < 15 %."}
      - {score_range: [7, 8], condition_expr: "(n2k_nearest_distance_km is null or n2k_nearest_distance_km >= 10) and (wdpa_nearest_distance_km is null or wdpa_nearest_distance_km >= 10)", descriptor: "Both networks NULL or >= 10 km."}
      - {score_range: [5, 6], condition_expr: "(n2k_nearest_distance_km is null or n2k_nearest_distance_km >= 5) and (wdpa_nearest_distance_km is null or wdpa_nearest_distance_km >= 5)", descriptor: "Both networks NULL or >= 5 km."}
      - {score_range: [3, 4], condition_expr: "(n2k_nearest_distance_km is null or n2k_nearest_distance_km >= 2) and (wdpa_nearest_distance_km is null or wdpa_nearest_distance_km >= 2)", descriptor: "Both networks NULL or >= 2 km; ecological review penalty, not exclusionary."}
      - {score_range: [1, 2], condition_expr: "(n2k_nearest_distance_km is not null and n2k_nearest_distance_km < 2) or (wdpa_nearest_distance_km is not null and wdpa_nearest_distance_km < 2)", descriptor: "< 2 km of either Natura 2000 or WDPA boundary; severe ecology penalty."}
      - {score_range: [0, 0], condition_expr: "site_within_strict_protected == true", descriptor: "E7: site within strict-category Natura 2000 polygon, WDPA IUCN Ia/Ib/II polygon, or internationally designated polygon (Ramsar / WHS / Emerald)."}
    fail_conditions:
      - {code: E7, action: exclude, condition_expr: "site_within_strict_protected == true", descriptor: "Natura 2000 polygon overlap OR WDPA IUCN Ia/Ib/II polygon overlap OR international-designation polygon overlap."}
      - {code: R1, action: review_flag, condition_expr: "n2k_sensitivity_class == 'high' or wdpa_sensitivity_class == 'high'", descriptor: "Connector flagged 'high' ecological sensitivity (overlap with non-strict IUCN polygon, or close-strict polygon within 2 km). Manual review."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NS-09
    name: Socioeconomic impact
    phases: [ranking]
    weight_factor: 5
    normalised_weight_pct: 1.8
    weight_factors: {baseline: 5, epri: 6}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NS-09 (SSG-35 §4.9; EPRI Step 3 socioeconomic)"}
    primary_metric: socio_tier
    db_fields: {api: [site_socioeconomic.unemployment_pct, site_socioeconomic.gdp_per_capita_eur], llm: ns09_socioeconomic_text}
    bands:
