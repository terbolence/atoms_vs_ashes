  - criterion_id: NH-14
    name: Combined hazards
    phases: [ranking]
    weight_factor: 3
    normalised_weight_pct: 1.1
    weight_factors: {baseline: 3, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-14 (SSG-35 §4.3(m))"}
    weight_factors: {baseline: 3, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-14 (SSG-35 §4.3(m))"}
    primary_metric: nh_min_resolved_score
    db_fields: {api: [site_natural_hazards.nh14_combined_index], llm: nh14_combined_text}
    # SP-F derived criterion: NH-14 is now computed by the engine from resolved
    # underlying NH-01/NH-03/NH-04/NH-08/NH-09/NH-10/NH-11 scores.
    # Required derivations (injected by ``_inject_nh14_derived_metrics`` in
    # ``scoring/_engine_loop.py``):
    #   - ``nh_resolved_count``: count of underlying NH criteria with a real band match.
    #   - ``nh_min_resolved_score``: minimum resolved score across the underlying set.
    #   - ``nh_count_below_5`` / ``nh_count_below_7``: count of resolved scores below those thresholds.
    # If fewer than 5 underlying criteria are resolved, no band matches and the engine
    # records NH-14 as ``unscored`` (no 5.0 default that would drag the composite down).
    bands:
      - {score_range: [9, 10], condition_expr: "nh_resolved_count >= 5 and nh_min_resolved_score >= 7 and nh_count_below_7 == 0", descriptor: "At least 5 underlying NH criteria resolved, all >= 7; no interaction pair below 7."}
      - {score_range: [7, 8], condition_expr: "nh_resolved_count >= 5 and nh_min_resolved_score >= 5 and nh_count_below_7 <= 1", descriptor: "At least 5 resolved, min >= 5, at most one criterion below 7."}
      - {score_range: [5, 6], condition_expr: "nh_resolved_count >= 5 and nh_min_resolved_score >= 3 and nh_count_below_5 <= 1", descriptor: "At least 5 resolved, exactly one moderate hazard (3-5) or moderate interaction only."}
      - {score_range: [3, 4], condition_expr: "nh_resolved_count >= 5 and nh_count_below_5 >= 2 and nh_min_resolved_score >= 1", descriptor: "Two or more underlying hazards below 5, or one severe pair both below 5."}
      - {score_range: [1, 2], condition_expr: "nh_resolved_count >= 5 and nh_min_resolved_score < 1 and nh_min_resolved_score > 0", descriptor: "One severe resolved hazard below 1 combined with another moderate hazard."}
      - {score_range: [0, 0], condition_expr: "nh_resolved_count >= 5 and nh_min_resolved_score == 0", descriptor: "Combined consequence reaches E-level exclusion."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
