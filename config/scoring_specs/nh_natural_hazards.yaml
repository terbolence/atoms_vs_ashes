# Natural hazards (NH) + basic filters (BF) scoring rubric. Source: report/sites_evaluation/03_criteria_natural_hazards.md.
# Phase: basic_filter|exclusionary|avoidance|ranking. fail_conditions.action: exclude|avoidance_penalty|screen_flag|review_flag.
family: nh
pass_mark_default: 5.0
criteria:
  - criterion_id: BF-01
    name: Grid export / connection adequacy (basic-filter note)
    phases: [basic_filter]
    weight_factor: 8
    normalised_weight_pct: 2.8
    weight_factors: {baseline: 8, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § BF-01 (EPRI grid screening; project A13)"}
    weight_factors: {baseline: 8, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § BF-01 (EPRI grid screening; project A13)"}
    db_fields: {api: [site_infrastructure_v2.nearest_substation_km, site_infrastructure_v2.hv_line_voltage_kv, site_infrastructure_v2.grid_export_capacity_mw], llm: bf01_grid_text}
    # Per SP-F decision: BF-01 is no longer scored. NS-02 is the single grid-connection score.
    # BF-01 stays as a basic-filter note. Bands below remain for descriptive context only;
    # they no longer enter the composite because phases drop the ``ranking`` tag.
    # Report-side evaluation should additionally describe headroom as a multiple of the
    # reference SMR module (77 MWe per NuScale module / 462 MWe per VOYGR-6 plant).
    bands:
      - {score_range: [9, 10], condition_expr: "nearest_substation_km <= 5 and hv_line_voltage_kv >= 400 and grid_export_capacity_mw >= 600", descriptor: "Note: substation <= 5 km, >= 400 kV, headroom >= 600 MW."}
      - {score_range: [7, 8], condition_expr: "nearest_substation_km <= 15 and hv_line_voltage_kv >= 220 and grid_export_capacity_mw >= 462", descriptor: "Note: substation 5-15 km, 220-399 kV, headroom >= VOYGR-6 net MWe."}
      - {score_range: [5, 6], condition_expr: "nearest_substation_km <= 30 or hv_line_voltage_kv >= 110", descriptor: "Note: substation 15-30 km OR 110-219 kV; reinforcement plausible."}
      - {score_range: [3, 4], condition_expr: "nearest_substation_km > 30 and hv_line_voltage_kv < 220", descriptor: "Note: distance > 30 km AND voltage < 220 kV."}
      - {score_range: [1, 2], condition_expr: "default", descriptor: "Note: no credible substation route."}
      - {score_range: [0, 0], condition_expr: "grid_export_capacity_mw == 0 and nearest_substation_km > 60", descriptor: "Note: no grid pathway (rare)."}
    fail_conditions:
      - {code: B1, action: screen_flag, condition_expr: "false", descriptor: "Non-scored note; B1 retained for audit continuity only."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: BF-02
    name: Land / nuclear-island footprint
    phases: [basic_filter, ranking]
    weight_factor: 5
    normalised_weight_pct: 1.8
    weight_factors: {baseline: 5, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § BF-02 (EPRI footprint; project A15)"}
    weight_factors: {baseline: 5, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § BF-02 (EPRI footprint; project A15)"}
    db_fields: {api: [site_infrastructure_v2.favourable_area_ha, site_infrastructure_v2.buildable_area_ha, site_infrastructure_v2.largest_contiguous_ha, sites.site_area_ha], llm: bf02_land_text}
    # SP-F band rework: minimum 50 ha per NuScale module, ideal 70 ha (project basis).
    # Multi-unit sites scale linearly via the engine-derived ``required_area_ha`` /
    # ``ideal_area_ha`` context fields (default = 50 / 70 for 1 module).
    bands:
      - {score_range: [9, 10], condition_expr: "largest_contiguous_ha >= ideal_area_ha and buildable_area_ha >= ideal_area_ha", descriptor: "Contiguous and buildable >= ideal area (70 ha/module)."}
      - {score_range: [7, 8], condition_expr: "largest_contiguous_ha >= required_area_ha and buildable_area_ha >= required_area_ha", descriptor: "Contiguous and buildable >= required area (50 ha/module)."}
      - {score_range: [5, 6], condition_expr: "buildable_area_ha >= required_area_ha * 0.8", descriptor: "80-100% of required area with documented expansion / layout flexibility."}
      - {score_range: [3, 4], condition_expr: "buildable_area_ha >= required_area_ha * 0.5", descriptor: "50-80% of required area; phased layout required."}
      - {score_range: [1, 2], condition_expr: "buildable_area_ha < required_area_ha * 0.5", descriptor: "< 50% of required area; insufficient for nuclear island at screening."}
      - {score_range: [0, 0], condition_expr: "buildable_area_ha == 0", descriptor: "No useable land."}
    fail_conditions:
      - {code: B2, action: screen_flag, condition_expr: "false", descriptor: "Scoring-band pivot; always false in engine."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-01
    name: Seismic ground motion (PGA)
    phases: [ranking, avoidance]
    weight_factor: 9
    normalised_weight_pct: 3.2
    weight_factors: {baseline: 9, epri: 5}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-01 (IAEA SSG-9; NS-R-3 §3; SSG-35; project A10)"}
    primary_metric: pga_2475yr_g
    db_fields: {api: [site_natural_hazards.nh01_pga_475yr_g, site_natural_hazards.nh01_pga_2475yr_g, site_natural_hazards.vs30_ms], llm: nh01_seismic_text}
    bands:
      - {score_range: [9, 10], condition_expr: "pga_2475yr_g <= 0.10", descriptor: "Very low long-return seismic demand; strong margin to the A10 design-envelope boundary."}
      - {score_range: [7, 8], condition_expr: "pga_2475yr_g <= 0.20", descriptor: "Low long-return seismic demand; clear margin to the A10 design-envelope boundary."}
      - {score_range: [5, 6], condition_expr: "pga_2475yr_g <= 0.50", descriptor: "At or below the A10 score-5 design-envelope boundary; acceptable only with vendor-specific confirmation."}
      - {score_range: [3, 4], condition_expr: "pga_2475yr_g < 0.75", descriptor: "Above the A10 boundary; specialist seismic review and likely avoidance penalty."}
      - {score_range: [1, 2], condition_expr: "pga_2475yr_g < 1.00", descriptor: "High long-return seismic demand; little practical margin to any generic SMR envelope."}
      - {score_range: [0, 0], condition_expr: "pga_2475yr_g >= 1.00", descriptor: "Extreme long-return seismic demand; outside generic screening envelope."}
    fail_conditions:
      - {code: A10, action: avoidance_penalty, condition_expr: "pga_2475yr_g > 0.5", descriptor: "Project screening: PGA(2475 yr) > 0.5 g fails Phase 2."}
      - {code: data_review_pga, action: review_flag, condition_expr: "pga_2475yr_g > 0.9", descriptor: "Likely data artefact; flag for data-validity review."}
    band_recipe: {kind: lower_is_better, fail_code: A10, metric: pga_2475yr_g}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-02
    name: Seismic surface rupture (capable faults)
    phases: [exclusionary, ranking]
    weight_factor: 9
    normalised_weight_pct: 3.2
    weight_factors: {baseline: 9, epri: 5}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-02 (NS-R-3 §3.7; SSG-35 Table II-1; E1)"}
    primary_metric: nearest_fault_km
    db_fields: {api: [site_natural_hazards.nearest_fault_km, site_natural_hazards.fault_name, site_natural_hazards.fault_slip_rate_mm_yr], llm: nh02_fault_text}
    bands:
      - {score_range: [9, 10], condition_expr: "nearest_fault_km >= 25.0", descriptor: "Very strong separation from mapped capable faults; surface-rupture concern effectively screened at desk-study level."}
      - {score_range: [7, 8], condition_expr: "nearest_fault_km >= 10.0", descriptor: "Clear separation from mapped capable faults; comfortably above the 5 km score boundary."}
      - {score_range: [5, 6], condition_expr: "nearest_fault_km >= 5.0", descriptor: "Borderline acceptable separation: meets the 5 km score boundary; check against the 8 km conservative screen and local capability evidence."}
      - {score_range: [3, 4], condition_expr: "nearest_fault_km >= 2.5", descriptor: "Below the 5 km score boundary; close enough to require detailed paleoseismic review and likely site rejection if the fault is capable."}
      - {score_range: [1, 2], condition_expr: "nearest_fault_km >= 1.0", descriptor: "Very close to a mapped fault; severe surface-rupture concern with little practical siting margin."}
      - {score_range: [0, 0], condition_expr: "nearest_fault_km < 1.0", descriptor: "Within or adjacent to a mapped fault trace; surface rupture cannot be screened out."}
    fail_conditions:
      # Single-pivot exclusion: condition_expr is auto-derived from
      # band_recipe.score5_pivot by the compiler when
      # derive_expr_from_recipe is true. The stored value must agree
      # with the derived form (drift guard in
      # atoms_vs_ashes.criterion_spec.compiler).
      - {code: E1, action: exclude, condition_expr: "nearest_fault_km < 5", pass_mark: 5.0, descriptor: "Capable fault within score-5 pivot distance.", derive_expr_from_recipe: true}
    band_recipe: {kind: fault_distance_higher_is_better, fail_code: E1, score5_pivot: 5.0}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-03
    name: Geotechnical - settlement and liquefaction
    # NH-03 hard-fails on E2 whenever susceptibility is high or
    # very-high AND remedy is explicitly absent (has_remedy == false).
    # "Remedy unknown" (has_remedy is null) is treated charitably for
    # `high` (lands at 5-6) and is only flagged via the safety floor
    # for `very_high` (lands at 3-4, caught by pass_mark=5.0). Bands
    # are mutually exclusive and cover every (susceptibility, remedy)
    # combination exactly once.
    phases: [exclusionary, ranking]
    weight_factor: 7
    normalised_weight_pct: 2.5
    weight_factors: {baseline: 7, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-03 (NS-R-3 §3.38-3.40; NS-G-3.6; E2)"}
    primary_metric: liquefaction_suscept
    db_fields: {api: [site_natural_hazards.liquefaction_suscept, site_natural_hazards.nh03_quality, site_natural_hazards.nh03_source, site_natural_hazards.bearing_capacity_kpa, site_natural_hazards.groundwater_depth_m, site_natural_hazards.pga_475yr_g, site_natural_hazards.depth_to_bedrock_m], llm: nh03_liquefaction_text}
    bands:
      - {score_range: [9, 10], condition_expr: "liquefaction_suscept in ['very_low', 'none']", descriptor: "Negligible susceptibility (Stage-1 favourable default)."}
      - {score_range: [7, 8], condition_expr: "liquefaction_suscept == 'low'", descriptor: "Low susceptibility; favourable at screening grade."}
      - {score_range: [5, 6], condition_expr: "liquefaction_suscept == 'moderate' or (liquefaction_suscept == 'high' and (has_remedy == true or has_remedy is null)) or (liquefaction_suscept == 'very_high' and has_remedy == true)", descriptor: "Moderate susceptibility, or high/very-high with documented (or pending for `high`) mitigation."}
      - {score_range: [3, 4], condition_expr: "liquefaction_suscept == 'very_high' and has_remedy is null", descriptor: "Very-high susceptibility with unknown remedy status (caught by safety floor)."}
      - {score_range: [1, 2], condition_expr: "liquefaction_suscept in ['high', 'very_high'] and has_remedy == false", descriptor: "High or very-high susceptibility with explicitly no documented mitigation (E2 hard fail)."}
    fail_conditions:
      - {code: E2, action: exclude, condition_expr: "liquefaction_suscept in ['high', 'very_high'] and has_remedy == false", pass_mark: 5.0, descriptor: "High or very-high liquefaction susceptibility with no engineering remedy."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-04
    name: Geotechnical - slope stability
    phases: [exclusionary, ranking]
    weight_factor: 5
    normalised_weight_pct: 1.8
    weight_factors: {baseline: 5, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-04 (SSG-35 Table I-1; NS-G-3.6; E3)"}
    primary_metric: slope_angle_deg
    db_fields: {api: [site_natural_hazards.slope_angle_deg, site_natural_hazards.slope_stability_class, site_natural_hazards.nh04_dem_cog_slope_max_deg], llm: nh04_slope_text}
    # NB: ``slope_angle_deg`` here is the MEAN slope over a 1 km buffer
    # around the site centroid (copernicus_dem/parsers.py::
    # compute_slope_stats → mean_deg). That is a screening proxy, not
    # an on-site footprint measurement, and it does NOT distinguish
    # "30° on the plant pad" from "30° at the foot of a hill 1 km
    # away". The connector also persists the max slope in the same
    # buffer (``nh04_dem_cog_slope_max_deg``) but the scoring rubric
    # does not currently consume it. See LL-022 in
    # prompts/lessons_learned.md for the open design defect and the
    # planned resolution (split on-site footprint slope vs runout /
    # lateral-hazard buffer signal). Until that lands, treat NH-04 as
    # a coarse screening lens only.
    bands:
      # Bands are auto-derived by the compiler from band_recipe with
      # kind=lower_is_better and score5_pivot=25 (IAEA SSG-9 §6.34 /
      # NUREG-0800 §2.5.5 envelope). The condition_expr values below
      # are kept identical to what compile_bundle emits so the spec
      # YAML stays self-describing; do not hand-edit these without
      # also updating score5_pivot.
      - {score_range: [9, 10], condition_expr: "slope_angle_deg <= 5.0", descriptor: "Flat to very gentle terrain; minimal earthworks; well within the SSG-9 mitigable envelope."}
      - {score_range: [7, 8], condition_expr: "slope_angle_deg <= 10.0", descriptor: "Gentle to moderate terrain; routine grading; comfortably within the SSG-9 envelope."}
      - {score_range: [5, 6], condition_expr: "slope_angle_deg <= 25.0", descriptor: "At or below the IAEA SSG-9 §6.34 mitigable envelope (25° on competent rock)."}
      - {score_range: [3, 4], condition_expr: "slope_angle_deg < 37.5", descriptor: "Above the SSG-9 envelope; mandatory geotechnical study; E3 hard fail."}
      - {score_range: [1, 2], condition_expr: "slope_angle_deg < 50.0", descriptor: "Severe instability risk; E3 hard fail."}
      - {score_range: [0, 0], condition_expr: "slope_angle_deg >= 50.0", descriptor: "Catastrophic; E3 hard fail."}
    fail_conditions:
      # Single-pivot exclusion (derive_expr_from_recipe=true). The
      # compiler regenerates condition_expr from
      # band_recipe.score5_pivot (IAEA SSG-9 §6.34 / NUREG-0800 §2.5.5
      # 25° envelope). Stored value must match what the compiler
      # derives or the drift guard refuses to load.
      - {code: E3, action: exclude, condition_expr: "slope_angle_deg > 25", pass_mark: 5.0, descriptor: "Slope above the SSG-9 mitigable envelope (score-5 pivot).", derive_expr_from_recipe: true}
    band_recipe: {kind: lower_is_better, fail_code: E3, score5_pivot: 25}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-05
    name: Subsidence / karst / mining / oil & gas
    phases: [ranking]
    weight_factor: 7
    normalised_weight_pct: 2.5
    weight_factors: {baseline: 7, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-05 (NS-R-3 §3.35-3.36; SSG-35; E5/E6)"}
    primary_metric: mining_void_distance_km
    # Ranking-only geotechnical review signal: norms require evaluation of
    # subsidence / collapse potential and remedy, not automatic exclusion
    # from mapped EGDI mine-feature proximity alone.
    db_fields: {api: [site_natural_hazards.karst_present, site_natural_hazards.karst_severity, site_natural_hazards.karst_formation_type, site_natural_hazards.mining_void_present, site_natural_hazards.mining_void_distance_km, site_natural_hazards.subsidence_risk_class], llm: nh05_subsidence_text}
    bands:
      - {score_range: [9, 10], condition_expr: "karst_severity == 'none' and mining_void_distance_km >= 10 and subsidence_risk_class in [null, 'none']", descriptor: "No karst; nearest mapped mine feature well beyond score-5 boundary; subsidence risk none/unknown."}
      - {score_range: [7, 8], condition_expr: "karst_severity in [null, 'none'] and mining_void_distance_km >= 4 and subsidence_risk_class in [null, 'none', 'low']", descriptor: "No karst on site; clear mine-feature distance margin; low/unknown subsidence risk."}
      - {score_range: [5, 6], condition_expr: "karst_severity in [null, 'none', 'moderate'] and (mining_void_distance_km is null or mining_void_distance_km >= 2) and subsidence_risk_class in [null, 'none', 'low', 'moderate', 'high']", descriptor: "Possible with geotechnical confirmation; mapped mine feature at/above acceptance pivot or unknown."}
      - {score_range: [3, 4], condition_expr: "mining_void_distance_km >= 1 and mining_void_distance_km < 2 and karst_severity != 'high'", descriptor: "Below mine-distance pivot but not extreme; geotechnical review required, ranking penalty only."}
      - {score_range: [1, 2], condition_expr: "mining_void_distance_km < 1 or karst_severity == 'high'", descriptor: "Close mine feature or high karst proxy; severe review signal, no exclusion without site-specific no-remedy evidence."}
    fail_conditions:
      - {code: E5, action: review_flag, condition_expr: "false", descriptor: "Review-only until site-specific karst-depth / under-footprint collapse evidence is available.", threshold_affects_expr: false}
      - {code: E6, action: review_flag, condition_expr: "false", descriptor: "Editable mine-feature distance score pivot; not a hard exclusion without under-footprint void or no-remedy subsidence evidence.", threshold_affects_expr: false}
    band_recipe: {kind: nh05_mine_composite, fail_code: E6, metric: mining_void_distance_km}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-06
    name: Foundation conditions (bearing, bedrock, groundwater)
    phases: [ranking]
    weight_factor: 5
    normalised_weight_pct: 1.8
    weight_factors: {baseline: 5, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-06 (NS-G-3.6)"}
    primary_metric: bearing_capacity_kpa
    db_fields: {api: [site_natural_hazards.bearing_capacity_kpa, site_natural_hazards.depth_to_bedrock_m, site_natural_hazards.groundwater_depth_m], llm: nh06_foundation_text}
    bands:
      - {score_range: [9, 10], condition_expr: "bearing_capacity_kpa > 200 and depth_to_bedrock_m < 5 and groundwater_depth_m > 5", descriptor: "Bearing > 200 kPa; bedrock < 5 m; GW > 5 m."}
      - {score_range: [7, 8], condition_expr: "bearing_capacity_kpa >= 150 and depth_to_bedrock_m <= 10 and groundwater_depth_m >= 3", descriptor: "Bearing 150-200 kPa; bedrock 5-10 m; GW 3-5 m."}
      - {score_range: [5, 6], condition_expr: "bearing_capacity_kpa >= 80", descriptor: "Typical European mixed conditions (bearing 80-150 kPa)."}
      - {score_range: [3, 4], condition_expr: "bearing_capacity_kpa >= 50 or depth_to_bedrock_m > 20 or groundwater_depth_m < 2", descriptor: "Bearing 50-80 kPa; bedrock > 20 m; GW < 2 m."}
      - {score_range: [1, 2], condition_expr: "bearing_capacity_kpa < 50", descriptor: "Bearing < 50 kPa or persistent artesian GW."}
      - {score_range: [0, 0], condition_expr: "default", descriptor: "Reserved (cross-link to NH-03/NH-05 exclusions only)."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-07
    name: Volcanism
    phases: [exclusionary, ranking]
    weight_factor: 10
    normalised_weight_pct: 3.5
    weight_factors: {baseline: 10, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-07 (IAEA SSG-21; SSG-35 Table I-1; E4)"}
    primary_metric: nearest_volcano_km
    db_fields: {api: [site_natural_hazards.nearest_volcano_km, site_natural_hazards.volcano_name, site_natural_hazards.nh07_hazard_class], llm: nh07_volcanism_text}
    notes: |
      Pivot anchored to IAEA SSG-21 §3.5-3.7 / SSG-9 §6.36 / SSG-35 Table I-1
      credible pyroclastic-density-current envelope at 50 km. The previous
      single-pivot sweep had picked up the legacy score-5 ranking-grade
      boundary (300 km) — that was the Smithsonian-GVP connector's *search
      radius* (every Holocene volcano within 300 km is loaded for the per-
      site hazard report), not an exclusion distance.

      band_recipe.null_policy=best: connector-NULL means
      "search ran, no Holocene volcano within 300 km" — positive evidence
      of safety, scores 9-10. Without this flag, the 240 NULL sites
      (66% of the merged DB) would silently land in the band evaluator's
      no-data default of 5.0.

      Soft review-flag R1 (nh07_hazard_class == 'avoidance') surfaces the
      connector's coarse avoidance verdict (VEI >= 4 within 40 km or
      recent eruption within 100 km, per the GVP connector). The three
      underlying sub-signals are not persisted as separate columns; a
      finer-grained split would require connector + schema changes
      (deferred to a separate plan).
    bands:
      - {score_range: [9, 10], condition_expr: "nearest_volcano_km is null or nearest_volcano_km >= 250.0", descriptor: "No plausible pathway (incl. beyond connector 300 km search radius)."}
      - {score_range: [7, 8], condition_expr: "nearest_volcano_km >= 100.0", descriptor: "Beyond credible PDC envelope; ashfall climatology only."}
      - {score_range: [5, 6], condition_expr: "nearest_volcano_km >= 50.0", descriptor: "At IAEA-anchored PDC envelope (SSG-21 §3.5 / SSG-9 §6.36)."}
      - {score_range: [3, 4], condition_expr: "nearest_volcano_km >= 25.0", descriptor: "Within credible PDC reach; specialist study required."}
      - {score_range: [1, 2], condition_expr: "nearest_volcano_km >= 10.0", descriptor: "Near volcanic edifice; severe direct-hazard exposure."}
      - {score_range: [0, 0], condition_expr: "nearest_volcano_km < 10.0", descriptor: "Within volcanic edifice / lava-reach zone."}
    fail_conditions:
      # Single-pivot exclusion (derive_expr_from_recipe=true):
      # condition_expr is auto-derived from band_recipe.score5_pivot
      # ("nearest_volcano_km < 50"), the IAEA-anchored PDC envelope.
      - {code: E4, action: exclude, condition_expr: "nearest_volcano_km < 50", pass_mark: 5.0, descriptor: "Holocene volcano within score-5 pivot distance.", derive_expr_from_recipe: true}
      # Soft review-flag for connector-side avoidance signal (VEI >= 4
      # within 40 km or recent eruption within 100 km — see Smithsonian
      # GVP batch). Coarse single-column proxy; granular split deferred.
      - {code: R1, action: review_flag, condition_expr: "nh07_hazard_class == 'avoidance'", descriptor: "Connector flagged volcanic avoidance signal (VEI >= 4 within 40 km or recent eruption within 100 km)."}
    band_recipe: {kind: higher_is_better, fail_code: E4, score5_pivot: 50, null_policy: best}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-08
    name: Coastal flooding (storm surge, tsunami)
    phases: [avoidance, ranking]
    weight_factor: 6
    normalised_weight_pct: 2.1
    weight_factors: {baseline: 6, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-08 (IAEA SSG-18; SSG-35 §A.19-A.27; A9/A11)"}
    primary_metric: coast_distance_km
    db_fields: {api: [site_natural_hazards.coast_distance_km, site_natural_hazards.storm_surge_class, site_natural_hazards.tsunami_zone_flag, sites.elevation_m], llm: nh08_coastal_text}
    bands:
      - {score_range: [9, 10], condition_expr: "coast_distance_km > 50 or elevation_m >= 50", descriptor: "Non-coastal OR elevation >= 50 m AMSL."}
      - {score_range: [7, 8], condition_expr: "coast_distance_km >= 10 and storm_surge_class in ['none', 'low']", descriptor: ">= 10 km from coast, low surge class."}
      - {score_range: [5, 6], condition_expr: "coast_distance_km >= 5", descriptor: "5-10 km from coast; mitigation feasible."}
      - {score_range: [3, 4], condition_expr: "coast_distance_km >= 2", descriptor: "2-5 km from coast; high surge/tsunami trace."}
      - {score_range: [1, 2], condition_expr: "coast_distance_km < 2", descriptor: "In 100-yr inundation extent without defensible mitigation."}
      - {score_range: [0, 0], condition_expr: "coast_distance_km < 2 and has_remedy == false", descriptor: "Indefensible coastal hazard."}
    fail_conditions:
      - {code: A9, action: avoidance_penalty, condition_expr: "coast_distance_km < 10 and elevation_m < 50", descriptor: ">= 10 km from sea / >= 1 km from lake, or elevation >= 50 m AMSL."}
    band_recipe: {kind: higher_is_better, fail_code: A9}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-09
    name: River flooding
    phases: [avoidance, ranking]
    weight_factor: 8
    normalised_weight_pct: 2.8
    weight_factors: {baseline: 8, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-09 (IAEA SSG-18; SSG-35 §A.28-A.30; A11)"}
    primary_metric: river_distance_km
    db_fields: {api: [site_natural_hazards.river_distance_km, site_natural_hazards.elevation_above_design_flood_m, site_natural_hazards.flood_zone_class_500yr], llm: nh09_river_flood_text}
    # SP-F (Ovidiu): flood-zone class is stronger than missing river-distance data.
    # Legacy engine reads bands below; compiler still rebuilds from band_recipe so
    # downstream callers using the recipe path retain the existing distance/elevation ladder.
    bands:
      - {score_range: [9, 10], condition_expr: "flood_zone_class_500yr in ['none', 'negligible'] or river_distance_km >= 10 or elevation_above_design_flood_m >= 30.5", descriptor: "Favourable flood-zone class OR outside 1000-yr extent (>= 10 km / >= 30.5 m separation)."}
      - {score_range: [7, 8], condition_expr: "flood_zone_class_500yr == 'low' or river_distance_km >= 4 or elevation_above_design_flood_m >= 30.5", descriptor: "Low flood-zone class OR outside 500-yr extent; meets project A11."}
      - {score_range: [5, 6], condition_expr: "flood_zone_class_500yr == 'moderate' or river_distance_km >= 2", descriptor: "Moderate flood-zone class OR 2-4 km from river; mitigation routine."}
      - {score_range: [3, 4], condition_expr: "flood_zone_class_500yr == 'high'", descriptor: "High flood-zone class; within 100-yr extent; defenses required."}
      - {score_range: [1, 2], condition_expr: "flood_zone_class_500yr in ['very_high', 'catastrophic']", descriptor: "Within 10-yr extent or unmitigated dam-break path."}
      - {score_range: [0, 0], condition_expr: "flood_zone_class_500yr == 'catastrophic' and (has_remedy == false or has_remedy is null)", descriptor: "No viable flood-defence pathway."}
    fail_conditions:
      - {code: A11, action: avoidance_penalty, condition_expr: "river_distance_km < 4 and elevation_above_design_flood_m < 30.5", descriptor: "Project avoidance: >= 4 km OR vertical separation >= 30.5 m (100 ft)."}
    band_recipe: {kind: flood_distance_or_elevation, fail_code: A11, elevation_pass_m: 30.5}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-10
    name: Extreme winds
    phases: [ranking]
    weight_factor: 3
    normalised_weight_pct: 1.1
    weight_factors: {baseline: 3, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-10 (IAEA SSG-18; SSG-35 Table I-1)"}
    primary_metric: max_wind_speed_ms
    db_fields: {api: [site_natural_hazards.max_wind_speed_ms, site_natural_hazards.extreme_wind_ms], llm: nh10_winds_text}
    bands:
      - {score_range: [9, 10], condition_expr: "max_wind_speed_ms < 25", descriptor: "Low wind region; standard EN 1991-1-4."}
      - {score_range: [7, 8], condition_expr: "max_wind_speed_ms < 30", descriptor: "Moderate (CEE typical)."}
      - {score_range: [5, 6], condition_expr: "max_wind_speed_ms < 36", descriptor: "Elevated; coastal or storm-track exposure."}
      - {score_range: [3, 4], condition_expr: "max_wind_speed_ms < 42", descriptor: "High; enhanced wind-load design."}
      - {score_range: [1, 2], condition_expr: "max_wind_speed_ms <= 49", descriptor: "Borderline acceptable; cyclone-class loads within design envelope, ranking penalty only."}
      - {score_range: [0, 0], condition_expr: "max_wind_speed_ms > 49", descriptor: "Outside project envelope (> 177 km/h)."}
    fail_conditions:
      - {code: project_wind_envelope, action: exclude, condition_expr: "max_wind_speed_ms > 49", descriptor: "Fujita-equivalent gust > 49 m/s (177 km/h)."}
    band_recipe: {kind: lower_is_better, fail_code: project_wind_envelope}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-11
    name: Extreme precipitation (rain, snow, drought)
    phases: [ranking]
    weight_factor: 3
    normalised_weight_pct: 1.1
    weight_factors: {baseline: 3, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-11 (IAEA SSG-18)"}
    db_fields: {api: [site_natural_hazards.spi12_min, site_natural_hazards.snow_months_per_year, site_natural_hazards.mean_annual_precip_mm, site_natural_hazards.extreme_precip_mm, site_natural_hazards.freezing_days_per_year], llm: nh11_precip_text}
    aggregation: {method: mean_of_sub_scores, round_to: 1, cap_if_any_sub_score_below: {threshold: 3, cap_score: 5}}
    sub_scores:
      - key: drought_spi12
        weight: 0.333
        primary_metric: spi12_min
        bands:
          - {score_range: [9, 10], condition_expr: "spi12_min > -1.0", descriptor: "SPI-12 > -1.0."}
          - {score_range: [7, 8], condition_expr: "spi12_min > -1.5", descriptor: "-1.5 to -1.0."}
          - {score_range: [5, 6], condition_expr: "spi12_min > -2.0", descriptor: "-2.0 to -1.5."}
          - {score_range: [3, 4], condition_expr: "spi12_min > -2.5", descriptor: "-2.5 to -2.0."}
          - {score_range: [1, 2], condition_expr: "spi12_min <= -2.5", descriptor: "< -2.5."}
      - key: snow_burden
        weight: 0.333
        primary_metric: snow_months_per_year
        bands:
          - {score_range: [9, 10], condition_expr: "snow_months_per_year <= 1", descriptor: "Negligible."}
          - {score_range: [7, 8], condition_expr: "snow_months_per_year <= 3", descriptor: "Mild winter zone."}
          - {score_range: [5, 6], condition_expr: "snow_months_per_year <= 5", descriptor: "CEE typical."}
          - {score_range: [3, 4], condition_expr: "snow_months_per_year <= 7", descriptor: "Significant winter constraint."}
          - {score_range: [1, 2], condition_expr: "snow_months_per_year >= 8", descriptor: "Arctic-grade design."}
      - key: annual_precip
        weight: 0.334
        primary_metric: mean_annual_precip_mm
        bands:
          - {score_range: [9, 10], condition_expr: "mean_annual_precip_mm >= 400 and mean_annual_precip_mm <= 800", descriptor: "Optimal."}
          - {score_range: [7, 8], condition_expr: "(mean_annual_precip_mm >= 300 and mean_annual_precip_mm < 400) or (mean_annual_precip_mm > 800 and mean_annual_precip_mm <= 1000)", descriptor: "Manageable."}
          - {score_range: [5, 6], condition_expr: "(mean_annual_precip_mm >= 200 and mean_annual_precip_mm < 300) or (mean_annual_precip_mm > 1000 and mean_annual_precip_mm <= 1500)", descriptor: "Tail risks emerging."}
          - {score_range: [3, 4], condition_expr: "(mean_annual_precip_mm >= 100 and mean_annual_precip_mm < 200) or (mean_annual_precip_mm > 1500 and mean_annual_precip_mm <= 2500)", descriptor: "Significant adaptation."}
          - {score_range: [1, 2], condition_expr: "mean_annual_precip_mm < 100 or mean_annual_precip_mm > 2500", descriptor: "Severe."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-12
    name: Extreme temperatures
    phases: [ranking]
    weight_factor: 4
    normalised_weight_pct: 1.4
    weight_factors: {baseline: 4, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-12 (IAEA SSG-18)"}
    db_fields: {api: [site_natural_hazards.extreme_temp_max_c, site_natural_hazards.extreme_temp_min_c], llm: nh12_temperature_text}
    aggregation: {method: min_of_sub_scores}
    sub_scores:
      - key: tmax
        primary_metric: extreme_temp_max_c
        bands:
          - {score_range: [9, 10], condition_expr: "extreme_temp_max_c < 33", descriptor: "Tmax < 33 C."}
          - {score_range: [7, 8], condition_expr: "extreme_temp_max_c < 36", descriptor: "33-36 C."}
          - {score_range: [5, 6], condition_expr: "extreme_temp_max_c < 39", descriptor: "36-39 C."}
          - {score_range: [3, 4], condition_expr: "extreme_temp_max_c <= 42", descriptor: "39-42 C."}
          - {score_range: [1, 2], condition_expr: "extreme_temp_max_c > 42", descriptor: "> 42 C."}
      - key: tmin
        primary_metric: extreme_temp_min_c
        bands:
          - {score_range: [9, 10], condition_expr: "extreme_temp_min_c > -15", descriptor: "Tmin > -15 C."}
          - {score_range: [7, 8], condition_expr: "extreme_temp_min_c > -20", descriptor: "-15 to -20 C."}
          - {score_range: [5, 6], condition_expr: "extreme_temp_min_c > -25", descriptor: "-20 to -25 C."}
          - {score_range: [3, 4], condition_expr: "extreme_temp_min_c >= -30", descriptor: "-25 to -30 C."}
          - {score_range: [1, 2], condition_expr: "extreme_temp_min_c < -30", descriptor: "< -30 C."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: NH-13
    name: Forest / wildfire
    phases: [ranking]
    weight_factor: 3
    normalised_weight_pct: 1.1
    weight_factors: {baseline: 3, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § NH-13 (SSG-35 §4.3(l))"}
    primary_metric: combustible_veg_pct
    db_fields: {api: [site_natural_hazards.combustible_veg_pct], llm: nh13_wildfire_text}
    bands:
      - {score_range: [9, 10], condition_expr: "combustible_veg_pct < 5", descriptor: "< 5% forest/grassland; no fire scars."}
      - {score_range: [7, 8], condition_expr: "combustible_veg_pct < 15", descriptor: "5-15%; < 1 large fire/decade."}
      - {score_range: [5, 6], condition_expr: "combustible_veg_pct < 35", descriptor: "15-35%; 1-3 fires/decade."}
      - {score_range: [3, 4], condition_expr: "combustible_veg_pct <= 60", descriptor: "35-60%; 3-6 fires/decade."}
      - {score_range: [1, 2], condition_expr: "combustible_veg_pct > 60", descriptor: "> 60%; > 6 fires/decade."}
