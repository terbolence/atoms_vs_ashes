# Emergency planning (EP) scoring rubric. Source: report/sites_evaluation/06_criteria_emergency_planning.md.
# Phase: basic_filter|exclusionary|avoidance|ranking. fail_conditions.action: exclude|avoidance_penalty|screen_flag|review_flag.
family: ep
pass_mark_default: 5.0
criteria:
  - criterion_id: EP-01
    name: Emergency-plan feasibility (composite)
    phases: [exclusionary, ranking]
    weight_factor: 8
    normalised_weight_pct: 0.0  # excluded from composite normalisation
    weight_factors: {baseline: 8, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § EP-01 (NS-R-3 §2.27-2.29; SSG-35 §4.6; E8)"}
    primary_metric: ep01_composite_score
    db_fields: {api: [site_emergency.ep01_composite_score], llm: ep01_feasibility_text}
    # EP-01 v4 (May-2026 exclusionary sweep, Option A in chat sign-off):
    # single-pivot rubric. One number — the DRV-02 / IAEA hard floor
    # (E8 default_value = 30) — drives both the 0-10 score bands AND
    # the E8 exclusion expression. The hand-written 85 / 70 / 42 / 35 / 30
    # ladder that lived here through v2/v3 was dead code: the compiler
    # had been silently rebuilding the bands from the recipe pivot since
    # band_recipe was wired. The bands below now match what the compiler
    # derives (so the legacy rubric loader and the spec compiler agree)
    # and derive_expr_from_recipe locks the E8 expression to the same
    # pivot via the drift guard in
    # atoms_vs_ashes.criterion_spec.compiler._validate_template_exclusion_drift.
    #
    # The FB-LL-12 decision (2026-05-13) to "soften the pass mark from 55
    # to 42" was a no-op at the engine layer for the same reason —
    # documented in audit/post_processing/scoring_conformity/ep01_direction_decision.md
    # and superseded here.
    #
    # The trauma-centre / hospital-overlay clauses were removed in v3
    # because the underlying columns do not exist on
    # site_emergency_planning and no connector populates them. See
    # IMPROVEMENTS.md IMP-0001 for the OSM connector follow-up that
    # would re-enable that gating.
    bands:
      - {score_range: [9, 10], condition_expr: "ep01_composite_score >= 82.5", descriptor: "High composite margin above the DRV-02 hard floor (>= 82.5/100)."}
      - {score_range: [7, 8], condition_expr: "ep01_composite_score >= 65", descriptor: "Clear composite margin above the DRV-02 hard floor (65-82.5)."}
      - {score_range: [5, 6], condition_expr: "ep01_composite_score >= 30", descriptor: "At or above the DRV-02 / IAEA hard-floor pass mark (30-65)."}
      - {score_range: [3, 4], condition_expr: "ep01_composite_score >= 22.5", descriptor: "Below the hard-floor pass mark but recoverable (22.5-30); ranking penalty AND E8 fires."}
      - {score_range: [1, 2], condition_expr: "ep01_composite_score >= 15", descriptor: "Severe shortfall below the hard floor (15-22.5); ranking penalty AND E8 fires."}
      - {score_range: [0, 0], condition_expr: "ep01_composite_score < 15", descriptor: "Outside the acceptance envelope (< 15)."}
    fail_conditions:
      # Single-pivot exclusion (derive_expr_from_recipe=true). The
      # compiler regenerates condition_expr from
      # band_recipe.score5_pivot (DRV-02 / IAEA hard floor at composite
      # 30/100). The stored value must agree with the derived form or
      # the drift guard refuses to load.
      - {code: E8, action: exclude, condition_expr: "ep01_composite_score < 30", pass_mark: 5.0, descriptor: "DRV-02 composite < 30: emergency-plan feasibility below the project hard floor.", derive_expr_from_recipe: true}
    band_recipe: {kind: score_percent_higher_is_better, fail_code: E8, score5_pivot: 30}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: EP-02
    name: Evacuation routes (road network)
    phases: [ranking]
    weight_factor: 6
    normalised_weight_pct: 2.6087
    weight_factors: {baseline: 6, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § EP-02 (SSG-35 §4.6(a)-(b))"}
    primary_metric: road_density_km_per_km2
    db_fields: {api: [site_emergency.road_density_km_per_km2, site_emergency.has_motorway_access], llm: ep02_routes_text}
    bands:
      - {score_range: [9, 10], condition_expr: "road_density_km_per_km2 >= 2.0 and has_motorway_access == true", descriptor: "Excellent network (>= 2.0 km/km2 with motorway)."}
      - {score_range: [7, 8], condition_expr: "road_density_km_per_km2 >= 1.0", descriptor: "Good capacity / redundancy (1.0-2.0)."}
      - {score_range: [5, 6], condition_expr: "road_density_km_per_km2 >= 0.5", descriptor: "Adequate primary routes (0.5-1.0)."}
      - {score_range: [3, 4], condition_expr: "road_density_km_per_km2 >= 0.3", descriptor: "Significant bottlenecks (0.3-0.5)."}
      - {score_range: [1, 2], condition_expr: "road_density_km_per_km2 < 0.3", descriptor: "Severe egress constraints."}
    fail_conditions:
      - {code: data_caveat_ll017, action: review_flag, condition_expr: "road_density_km_per_km2 == 0", descriptor: "LL-017 silent-null: treat 0.000 as insufficient; fallback to LLM with quality=low (+/-1 band)."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: EP-03
    name: Physical-geography constraints
    phases: [ranking]
    weight_factor: 5
    normalised_weight_pct: 2.1739
    weight_factors: {baseline: 5, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § EP-03 (SSG-35 §4.6(a))"}
    primary_metric: relief_m_per_10km
    db_fields: {api: [site_emergency.major_river_barrier, site_emergency.waterway_count_epz, site_emergency.relief_m_per_10km, site_emergency.ep03_gee_relief_16km_m], llm: ep03_geography_text}
    # Interim barrier/waterway bands score when measured relief is absent; GEE relief
    # maps to ``relief_m_per_10km`` via merge_context_derivations (16 km window proxy).
    bands:
      - {score_range: [9, 10], condition_expr: "relief_m_per_10km is null and major_river_barrier == false and (waterway_count_epz is null or waterway_count_epz <= 1)", descriptor: "No measured relief; open river/waterway context (interim screening)."}
      - {score_range: [7, 8], condition_expr: "relief_m_per_10km is null and major_river_barrier == false and waterway_count_epz <= 3", descriptor: "No measured relief; mild waterway crossings only (interim)."}
      - {score_range: [5, 6], condition_expr: "relief_m_per_10km is null and major_river_barrier == false", descriptor: "No measured relief; manageable barrier/waterway context (interim)."}
      - {score_range: [3, 4], condition_expr: "relief_m_per_10km is null and major_river_barrier == true and (waterway_count_epz is null or waterway_count_epz <= 2)", descriptor: "No measured relief; major river barrier with limited crossings (interim)."}
      - {score_range: [1, 2], condition_expr: "relief_m_per_10km is null and major_river_barrier == true", descriptor: "No measured relief; major river barrier (interim)."}
      - {score_range: [9, 10], condition_expr: "relief_m_per_10km < 50 and major_river_barrier == false", descriptor: "Open well-connected terrain; < 50 m relief; no waterway barrier."}
      - {score_range: [7, 8], condition_expr: "relief_m_per_10km < 150 or waterway_count_epz == 1", descriptor: "Mild relief or single river crossing."}
      - {score_range: [5, 6], condition_expr: "relief_m_per_10km < 300", descriptor: "Typical CEE constraints; manageable with planning."}
      - {score_range: [3, 4], condition_expr: "relief_m_per_10km < 600 or (major_river_barrier == true and waterway_count_epz <= 1)", descriptor: "Major mountain barrier or wide river without redundant crossings."}
      - {score_range: [1, 2], condition_expr: "relief_m_per_10km >= 600 or island_flag == true", descriptor: "Island or deep mountain valley with single egress."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: EP-04
    name: Special populations (hospitals, prisons, care homes)
    phases: [ranking]
    weight_factor: 6
    normalised_weight_pct: 2.6087
    weight_factors: {baseline: 6, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § EP-04 (SSG-35 §4.6(c))"}
    primary_metric: special_pop_count
    db_fields: {api: [site_emergency.hospital_count_epz, site_emergency.prison_count_epz, site_emergency.care_home_count_epz], llm: ep04_special_pop_text}
    bands:
      - {score_range: [9, 10], condition_expr: "special_pop_count <= 2", descriptor: "0-2 facilities."}
      - {score_range: [7, 8], condition_expr: "special_pop_count <= 8", descriptor: "3-8."}
      - {score_range: [5, 6], condition_expr: "special_pop_count <= 25", descriptor: "9-25."}
      - {score_range: [3, 4], condition_expr: "special_pop_count <= 60", descriptor: "26-60."}
      - {score_range: [1, 2], condition_expr: "special_pop_count > 60", descriptor: "> 60."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: EP-05
    name: Concurrent-hazard impact on EP
    phases: [ranking]
    weight_factor: 4
    normalised_weight_pct: 1.7391
    weight_factors: {baseline: 4, epri: 4}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § EP-05 (SSG-35 §4.6(f))"}
    primary_metric: ep05_concurrent_index
    db_fields: {api: [site_emergency.ep05_concurrent_index], llm: ep05_concurrent_text}
    bands:
      - {score_range: [9, 10], condition_expr: "ep05_concurrent_index == 'none'", descriptor: "No material concurrent-hazard EP concerns."}
      - {score_range: [7, 8], condition_expr: "ep05_concurrent_index == 'weak'", descriptor: "Weak drivers; standard hardening sufficient."}
      - {score_range: [5, 6], condition_expr: "ep05_concurrent_index == 'manageable'", descriptor: "Manageable interactions with planning + hardening."}
      - {score_range: [3, 4], condition_expr: "ep05_concurrent_index == 'multiple'", descriptor: "Multiple credible combinations; explicit EP resilience investment."}
      - {score_range: [1, 2], condition_expr: "ep05_concurrent_index == 'severe'", descriptor: "Strong evidence concurrent hazards routinely degrade EP severely."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
