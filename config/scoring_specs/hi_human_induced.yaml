# man_hours: 5.8
# Human-induced hazards (HI) scoring rubric. Source: report/sites_evaluation/04_criteria_human_induced.md.
# Phase: basic_filter|exclusionary|avoidance|ranking. fail_conditions.action: exclude|avoidance_penalty|screen_flag|review_flag.
family: hi
pass_mark_default: 5.0
criteria:
  - criterion_id: HI-01
    name: Aircraft crash hazard
    phases: [avoidance, ranking]
    weight_factor: 7
    normalised_weight_pct: 3.0435
    weight_factors: {baseline: 7, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-01 (IAEA NS-G-3.1; SSG-35 Table II-1; A1-A4)"}
    primary_metric: composite
    db_fields: {api: [site_human_induced.nearest_airport_km, site_human_induced.nearest_airport_type, site_human_induced.nearest_airport_class, site_human_induced.nearest_military_airfield_km, site_human_induced.nearest_military_class, site_human_induced.nearest_military_km, site_human_induced.nearest_high_consequence_military_class, site_human_induced.nearest_high_consequence_military_km, site_human_induced.hi06_quality, site_human_induced.flight_path_distance_km, site_human_induced.hi01_comment], llm: hi01_aircraft_text}
    # HI-01 v4 (Phase 1C of v1.03 feedback closure, reviewer #183):
    # helipads / small / heliport / GA / seaplane / balloonport classes
    # contribute NO scoring signal to HI-01. Only large + medium commercial
    # and military airports drive bands and A2/A3/A4. The small/heliport
    # distances are still persisted by the OurAirports connector for
    # transparency, but they are absent from band conditions, fail
    # conditions, the flight-path proxy, and the scoring context.
    # Band order is INTENTIONAL: the engine takes the first matching band.
    bands:
      - {score_range: [9, 10], condition_expr: "nearest_airport_class is null", descriptor: "No large / medium / military airport in OurAirports search radius (search completed, nothing in scoring scope)."}
      - {score_range: [0, 0], condition_expr: "under_flight_path == true", descriptor: "Direct under-flight of a commercial aircraft corridor with no remedy."}
      - {score_range: [1, 2], condition_expr: "nearest_large_airport_km < 8 or nearest_military_airfield_km < 16", descriptor: "Large airport < 8 km or military airbase < 16 km."}
      - {score_range: [3, 4], condition_expr: "nearest_major_airport_km < 15 or nearest_military_airfield_km < 30 or flight_path_distance_km < 4", descriptor: "Major airport < 15 km, flight-path proxy < 4 km, or military airbase < 30 km (avoidance penalty)."}
      - {score_range: [9, 10], condition_expr: "nearest_major_airport_km > 30 and (flight_path_distance_km is null or flight_path_distance_km >= 4) and (nearest_military_airfield_km is null or nearest_military_airfield_km > 60)", descriptor: "Nearest large/medium airport > 30 km, no flight-path proxy < 4 km, and no military airbase within 60 km."}
      - {score_range: [7, 8], condition_expr: "nearest_major_airport_km >= 15 and nearest_major_airport_km <= 30 and (under_flight_path == false or under_flight_path is null) and (flight_path_distance_km is null or flight_path_distance_km >= 4)", descriptor: "Major airport 15-30 km, no overhead flight path or < 4 km flight-path proxy."}
      - {score_range: [5, 6], condition_expr: "nearest_major_airport_km >= 15 or nearest_military_airfield_km >= 30 or flight_path_distance_km >= 4", descriptor: "Outside avoidance-proximity thresholds, but not enough margin for a high band."}
    # A2-A4 split per report/sites_evaluation/10_appendices.md Table A.2 and
    # report/sites_evaluation/04_criteria_human_induced.md §4.3 HI-01. A1
    # (small / GA / heliport < 10 km) was retired in Phase 1C of the v1.03
    # feedback closure (reviewer #183): only large + medium commercial and
    # military airports drive HI-01 scoring penalties.
    fail_conditions:
      - {code: A2, action: avoidance_penalty, condition_expr: "nearest_major_airport_km < 15", descriptor: "A2 — Project: commercial / large / medium airport < 15 km (SSG-35 ≥ 16 km)."}
      - {code: A3, action: avoidance_penalty, condition_expr: "nearest_military_airfield_km < 30 or (nearest_airport_km < 30 and nearest_airport_type in ['military', 'military_major', 'military_minor', 'military_base'])", null_pass_condition_expr: "nearest_military_airfield_km is null and hi06_quality in ['ok', 'verified', 'high', 'medium', 'low', 'screening', 'screening_default', 'approximate']", descriptor: "A3 — Project: military airport < 30 km (SSG-35 ≥ 16 km military)."}
      - {code: A4, action: avoidance_penalty, condition_expr: "under_flight_path == true or flight_path_distance_km < 4", descriptor: "A4 — SSG-35: flight-path overhead / < 4 km from airway (large + medium classes only)."}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: HI-02
    name: Industrial explosions (Seveso / IED)
    phases: [avoidance, ranking]
    weight_factor: 7
    normalised_weight_pct: 3.0435
    weight_factors: {baseline: 7, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-02 (NS-R-3 §3.49-3.50; NS-G-3.1; A7)"}
    primary_metric: nearest_seveso_km
    db_fields: {api: [site_human_induced.nearest_seveso_km, site_human_induced.nearest_ied_km, site_human_induced.hi02_quality], llm: hi02_explosions_text}
    # SP-F sentinel rework: distinguish "search completed - no facility found" (favourable)
    # from "search not completed / data missing" (unscored). Compiler still rebuilds bands
    # from band_recipe when called via spec path.
    bands:
      - {score_range: [9, 10], condition_expr: "(nearest_seveso_km is null and hi02_search_completed == true) or nearest_seveso_km > 20", descriptor: "> 20 km, or completed Seveso search found nothing in radius."}
      - {score_range: [7, 8], condition_expr: "nearest_seveso_km >= 10", descriptor: "10-20 km."}
      - {score_range: [5, 6], condition_expr: "nearest_seveso_km >= 5", descriptor: "5-10 km (project A7 pass-mark)."}
      - {score_range: [3, 4], condition_expr: "nearest_seveso_km >= 2", descriptor: "2-5 km."}
      - {score_range: [1, 2], condition_expr: "nearest_seveso_km < 2", descriptor: "< 2 km."}
      - {score_range: [0, 0], condition_expr: "nearest_seveso_km < 0.5 and has_mitigation == false", descriptor: "Direct adjacency with credible ignition and no mitigation."}
    fail_conditions:
      - {code: A7, action: avoidance_penalty, condition_expr: "nearest_seveso_km < 5", null_pass_condition_expr: "nearest_seveso_km is null and hi02_search_completed == true", descriptor: "Project avoidance: >= 5 km from flammable/toxic/explosive storage."}
    band_recipe: {kind: higher_is_better, fail_code: A7, null_best_condition_expr: "hi02_search_completed == true"}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: HI-03
    name: Toxic / gas releases
    phases: [avoidance, ranking]
    weight_factor: 7
    normalised_weight_pct: 3.0435
    weight_factors: {baseline: 7, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-03 (IAEA NS-G-3.1; SSG-35 Table II-1; A8)"}
    primary_metric: nearest_toxic_source_km
    db_fields: {api: [site_human_induced.nearest_toxic_source_km, site_human_induced.toxic_source_type, site_human_induced.hi03_quality], llm: hi03_toxic_text}
    bands:
      - {score_range: [9, 10], condition_expr: "(nearest_toxic_source_km is null and hi03_search_completed == true) or nearest_toxic_source_km > 25", descriptor: "> 25 km, or completed toxic-source search found nothing in radius."}
      - {score_range: [7, 8], condition_expr: "nearest_toxic_source_km >= 15", descriptor: "15-25 km."}
      - {score_range: [5, 6], condition_expr: "nearest_toxic_source_km >= 8", descriptor: "8-15 km (project A8 pass-mark)."}
      - {score_range: [3, 4], condition_expr: "nearest_toxic_source_km >= 3", descriptor: "3-8 km."}
      - {score_range: [1, 2], condition_expr: "nearest_toxic_source_km < 3", descriptor: "< 3 km."}
      - {score_range: [0, 0], condition_expr: "nearest_toxic_source_km < 1 and has_mitigation == false", descriptor: "Hazardous-cloud envelope intersect with no mitigation."}
    fail_conditions:
      - {code: A8, action: avoidance_penalty, condition_expr: "nearest_toxic_source_km < 8", null_pass_condition_expr: "nearest_toxic_source_km is null and hi03_search_completed == true", descriptor: "Project avoidance: >= 8 km from hazardous-cloud sources."}
    band_recipe: {kind: higher_is_better, fail_code: A8, null_best_condition_expr: "hi03_search_completed == true"}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: HI-04
    name: External fires
    phases: [avoidance, ranking]
    weight_factor: 6
    normalised_weight_pct: 2.6087
    weight_factors: {baseline: 6, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-04 (IAEA NS-G-3.1)"}
    primary_metric: nearest_flammable_storage_km
    db_fields: {api: [site_human_induced.nearest_flammable_storage_km, site_human_induced.nearest_pipeline_km, site_human_induced.hi04_quality], llm: hi04_external_fires_text}
    # SP-F sentinel rework: distinguish "search completed - no major flammable storage"
    # (favourable) from "search not completed" (unscored).
    bands:
      - {score_range: [9, 10], condition_expr: "(nearest_flammable_storage_km is null and hi04_search_completed == true) or nearest_flammable_storage_km > 15", descriptor: "> 15 km, or completed flammable-storage search found nothing in radius."}
      - {score_range: [7, 8], condition_expr: "nearest_flammable_storage_km >= 8", descriptor: "8-15 km."}
      - {score_range: [5, 6], condition_expr: "nearest_flammable_storage_km >= 4", descriptor: "4-8 km."}
      - {score_range: [3, 4], condition_expr: "nearest_flammable_storage_km >= 1", descriptor: "1-4 km."}
      - {score_range: [1, 2], condition_expr: "nearest_flammable_storage_km < 1", descriptor: "< 1 km."}
      - {score_range: [0, 0], condition_expr: "nearest_flammable_storage_km < 0.2 and has_mitigation == false", descriptor: "Adjacent major flammable facility with credible ignition."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: HI-05
    name: Transport hazards (hazmat road / rail / pipe)
    phases: [ranking]
    weight_factor: 6
    normalised_weight_pct: 2.6087
    weight_factors: {baseline: 6, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-05 (IAEA NS-G-3.1)"}
    weight_factors: {baseline: 6, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-05 (IAEA NS-G-3.1)"}
    primary_metric: nearest_hazmat_corridor_km
    db_fields: {api: [site_human_induced.nearest_hazmat_corridor_km, site_human_induced.hi05_quality], llm: hi05_transport_text}
    # SP-F sentinel rework: score MAJOR hazmat corridors only (long-haul rail/pipe/highway
    # carrying credible hazmat). ``hi05_search_completed`` is derived from
    # ``site_human_hazards.hi05_quality`` (not null and not ``no_data``).
    # Asymmetric NULL: ``has_pinch_point is null`` is treated as no-pinch-point, not a penalty.
    bands:
      - {score_range: [9, 10], condition_expr: "(nearest_hazmat_corridor_km is null and hi05_search_completed == true) or nearest_hazmat_corridor_km > 10", descriptor: "> 10 km, or completed hazmat-corridor search found no major corridor in radius."}
      - {score_range: [7, 8], condition_expr: "nearest_hazmat_corridor_km >= 5", descriptor: "5-10 km."}
      - {score_range: [5, 6], condition_expr: "nearest_hazmat_corridor_km >= 2", descriptor: "2-5 km."}
      - {score_range: [3, 4], condition_expr: "nearest_hazmat_corridor_km >= 1", descriptor: "1-2 km."}
      - {score_range: [1, 2], condition_expr: "nearest_hazmat_corridor_km < 1", descriptor: "< 1 km."}
      - {score_range: [0, 0], condition_expr: "nearest_hazmat_corridor_km < 0.1 and has_pinch_point == true", descriptor: "Unique pinch point immediately adjacent to safety footprint."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: HI-06
    name: Military installations
    phases: [avoidance, ranking]
    weight_factor: 6
    normalised_weight_pct: 2.6087
    weight_factors: {baseline: 6, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-06 (IAEA NS-G-3.1; SSG-35 Table II-1; A5-A6)"}
    primary_metric: nearest_military_km
    db_fields: {api: [site_human_induced.nearest_military_km, site_human_induced.military_type], llm: hi06_military_text}
    bands:
      - {score_range: [9, 10], condition_expr: "nearest_military_km > 60", descriptor: "> 60 km."}
      - {score_range: [7, 8], condition_expr: "nearest_military_km >= 30", descriptor: "30-60 km."}
      - {score_range: [5, 6], condition_expr: "nearest_military_km >= 15", descriptor: "15-30 km (project A5 boundary)."}
      - {score_range: [3, 4], condition_expr: "nearest_military_km >= 8", descriptor: "8-15 km."}
      - {score_range: [1, 2], condition_expr: "nearest_military_km < 8", descriptor: "< 8 km."}
      - {score_range: [0, 0], condition_expr: "nearest_military_km < 0.5 and military_type == 'active_exclusion'", descriptor: "Inside live military exclusion polygon."}
    fail_conditions:
      - {code: A5, action: avoidance_penalty, condition_expr: "nearest_military_km < 30 and military_type in ['firing_range', 'bombing_range', 'practice_range']", descriptor: "Project A5: >= 30 km from practice/bombing/firing ranges."}
      - {code: A6, action: avoidance_penalty, condition_expr: "nearest_military_km < 8 and military_type == 'ammunition_storage'", descriptor: "Project A6: >= 8 km from ammunition storage."}
    band_recipe: {kind: higher_is_better, fail_code: A5}
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: HI-07
    name: Electromagnetic interference
    phases: [ranking]
    weight_factor: 2
    normalised_weight_pct: 0.8696
    weight_factors: {baseline: 2, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-07 (SSG-35 §4.4(c))"}
    primary_metric: transmitter_count_10km
    db_fields: {api: [site_human_induced.transmitter_count_10km, site_human_induced.nearest_transmitter_km, site_human_induced.transmitter_type, site_human_induced.hi07_quality, site_human_induced.hi07_comment, site_human_induced.run_id, site_human_induced.fetched_at], llm: hi07_emi_text}
    notes: |
      Tier 1 Data OK repair (2026-05-17): uses existing OSM transmitter
      count/proximity evidence only. ``transmitter_count_10km`` is a legacy
      scoring alias for ORM column ``site_human_hazards.transmitter_count``;
      the source comments identify the persisted count as the connector's
      available transmitter search-count proxy, not a verified 10 km-only
      count. ``nearest_transmitter_km`` and ``transmitter_type`` are measured
      context fields. ``hi07_quality`` supplies the completed-search sentinel
      so sparse/no-count evidence is favorable only when the search actually
      completed. ``transmitter_power_class`` is unsupported in the current
      schema and deferred to a future connector/schema task.
    bands:
      - {score_range: [9, 10], condition_expr: "hi07_search_completed == true and transmitter_count_10km <= 5 and (nearest_transmitter_km is null or nearest_transmitter_km > 10)", descriptor: "Sparse and distant transmitter proxy: at most five transmitter-like features and none measured within 10 km."}
      - {score_range: [7, 8], condition_expr: "hi07_search_completed == true and transmitter_count_10km <= 10 and (nearest_transmitter_km is null or nearest_transmitter_km > 5)", descriptor: "Low RF-density proxy: at most ten transmitter-like features and none measured within 5 km."}
      - {score_range: [1, 2], condition_expr: "hi07_search_completed == true and (transmitter_count_10km > 100 or nearest_transmitter_km < 2)", descriptor: "Very dense or nearby transmitter proxy: >100 transmitter-like features in radius or nearest feature < 2 km. Power class not measured."}
      - {score_range: [3, 4], condition_expr: "hi07_search_completed == true and (transmitter_count_10km > 25 or nearest_transmitter_km < 5)", descriptor: "Dense or near transmitter proxy: >25 features in radius or nearest feature < 5 km. Review RF/EMI controls."}
      - {score_range: [5, 6], condition_expr: "hi07_search_completed == true and (transmitter_count_10km is not null or nearest_transmitter_km is not null)", descriptor: "Scoreable ordinary RF environment from count/proximity evidence; power-class-specific severity deferred."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
  - criterion_id: HI-08
    name: Other nuclear installations
    phases: [ranking]
    weight_factor: 3
    normalised_weight_pct: 1.3043
    weight_factors: {baseline: 3, epri: 3}
    weight_basis_source: {baseline: "report/sites_evaluation/02_master_weights.md §3 master weight table (project engineering team intent)", epri: "docs/expert_siting_criteria_evaluation_matrix.md § HI-08 (SSG-35 §3.24-3.27)"}
    primary_metric: nearest_nuclear_km
    db_fields: {api: [site_human_induced.nearest_nuclear_km, site_human_induced.hi08_quality], llm: hi08_other_nuclear_text}
    # SP-F sentinel rework: distinguish "search completed - no nuclear installation in radius"
    # (favourable) from "search not completed" (unscored). Reactor-type distinction (operating
    # / shutdown / research / waste / never-operated) is a future SP-F follow-up that needs
    # a connector enhancement (currently only ``nearest_nuclear_km`` is populated).
    bands:
      - {score_range: [9, 10], condition_expr: "(nearest_nuclear_km is null and hi08_search_completed == true) or nearest_nuclear_km > 100", descriptor: "> 100 km, or completed search found no relevant nuclear installation in radius."}
      - {score_range: [7, 8], condition_expr: "nearest_nuclear_km >= 50", descriptor: "50-100 km."}
      - {score_range: [5, 6], condition_expr: "nearest_nuclear_km >= 20", descriptor: "20-50 km."}
      - {score_range: [3, 4], condition_expr: "nearest_nuclear_km >= 5", descriptor: "5-20 km."}
      - {score_range: [1, 2], condition_expr: "nearest_nuclear_km < 5", descriptor: "< 5 km with unresolved interface."}
    fail_conditions: []
    quality_floor: {low_quality_uncertainty_bands: 1}
