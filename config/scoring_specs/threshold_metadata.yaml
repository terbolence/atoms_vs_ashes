# man_hours: 4.2
# User-controllable failure thresholds — IAEA / SSG / NUREG anchors.
#
# This sidecar is merged into config/scoring_specs/*.yaml at load time
# (see atoms_vs_ashes.criterion_spec.loader.load_template_bundle).
# Keys: <criterion_id>.<code> -> ThresholdSpec.
#
# Each entry adds a `threshold` block to the matching `fail_condition`
# without modifying the rubric YAMLs themselves. This preserves byte-
# exact rubric parity (test_compiler_parity) while still surfacing
# user-controllable variables to the GUI / preview service.
#
# Codes WITHOUT an entry below are treated as fixed best-practice
# envelopes (categorical screens, multi-clause expressions, composite
# subscores) and the run-profile validator will reject overrides on
# them.

NH-01:
  A10:
    metric: pga_2475yr_g
    op: ">"
    default_value: 0.5
    units: g
    label: "PGA (2475 yr) avoidance ceiling"
    kind: numeric
    recommended:
      value: 0.5
      rationale: >
        Project Phase-2 avoidance threshold; aligns with NUREG-0800 §2.5.2
        design-basis envelopes for non-LWR small modular reactors.
      sources: ["IAEA SSG-9 §6.18", "NUREG-0800 §2.5.2"]
    bounds: {min: 0.2, max: 1.5}

NH-02:
  E1:
    metric: nearest_fault_km
    op: "<"
    default_value: 8.0
    units: km
    label: "Capable fault separation"
    kind: numeric
    recommended:
      value: 8.0
      rationale: >
        IAEA SSG-9 / SSG-35 require avoidance of capable faults; the project
        adopts an 8 km buffer consistent with SSG-35 and NUREG-0800
        §2.5.3 site characterisation envelopes. Overriding this value
        regenerates only the simple separation expression; the slip-rate
        clause is a fixed best-practice envelope and is not user-tunable.
      sources: ["IAEA SSG-9 §6.21", "IAEA SSG-35 §3.18-3.22", "NUREG-0800 §2.5.3"]
    bounds: {min: 1.0, max: 25.0}

NH-04:
  E3:
    metric: slope_angle_deg
    op: ">="
    default_value: 25
    units: degrees
    label: "Maximum acceptable slope angle"
    kind: numeric
    recommended:
      value: 25
      rationale: >
        IAEA SSG-9 §6.34 and NUREG-0800 §2.5.5 treat slopes > 25 deg on
        competent rock (or any catastrophic-class slope) as effectively
        non-mitigable for safety-related foundations. The catastrophic
        slope-stability clause is fixed best practice.
      sources: ["IAEA SSG-9 §6.34", "NUREG-0800 §2.5.5"]
    bounds: {min: 10, max: 45}

NH-05:
  E6:
    metric: mining_void_distance_km
    op: "<"
    default_value: 2.0
    units: km
    label: "Acceptable mapped mine-feature distance"
    kind: numeric
    recommended:
      value: 2.0
      rationale: >
        Project review pivot for mapped EGDI mine/mining-heritage proximity.
        IAEA geotechnical guidance requires evaluation of subsidence and
        collapse potential plus practicable remedy; it does not set a
        universal hard-exclusion distance for mapped mine features.
      sources: ["IAEA SSR-1 Req. 8", "IAEA NS-G-3.6 §3.29-3.35", "Project geotechnical screening basis"]
    bounds: {min: 0.0, max: 25.0}

NH-07:
  E4:
    metric: nearest_volcano_km
    op: "<"
    default_value: 50
    units: km
    label: "Minimum distance to Holocene volcano"
    kind: numeric
    recommended:
      value: 50
      rationale: >
        Project default per IAEA SSG-21 §3.5-3.7 / SSG-9 §6.36: 50 km buffer
        from a Holocene volcano captures the credible pyroclastic-density-
        current envelope. The pyroclastic-zone clause is a separate map-
        based check that remains as a best-practice envelope.
      sources: ["IAEA SSG-9 §6.36", "IAEA SSG-21 §3.5"]
    bounds: {min: 25, max: 200}

NH-10:
  project_wind_envelope:
    metric: max_wind_speed_ms
    op: ">"
    default_value: 49
    units: m/s
    label: "Project wind envelope"
    kind: numeric
    recommended:
      value: 49
      rationale: >
        Project wind envelope corresponds to ~177 km/h (Fujita-equivalent
        EF2 boundary). Higher values require enhanced wind-load design
        that the project SMR designs do not envelope.
      sources: ["IAEA SSG-9 §6.49", "EN 1991-1-4"]
    bounds: {min: 35, max: 80}

NS-02:
  A13:
    metric: grid_export_capacity_mw
    op: "<"
    default_value: 462
    units: MW
    label: "Minimum grid export capacity"
    kind: numeric
    recommended:
      value: 462
      rationale: >
        Project A13 anchors transmission headroom to the reference SMR
        net electrical output (NuScale VOYGR-6 = 462 MWe). Adjust to the
        net rating of the dominant SMR design under evaluation.
      sources: ["IAEA NS-G-1.13 §5.18", "Project SMR design assumptions"]
    bounds: {min: 100, max: 1500}

NS-05:
  A15:
    metric: largest_contiguous_ha
    op: "<"
    default_value: 14
    units: ha
    label: "Minimum contiguous land"
    kind: numeric
    recommended:
      value: 14
      rationale: >
        Project A15: 14 ha contiguous industrial land matches the standard
        NuScale 4-pack footprint with associated balance-of-plant + ISFSI
        envelope.
      sources: ["IAEA SSG-35 §3.30", "NuScale SDA Tier 2 §1.2"]
    bounds: {min: 5, max: 50}

EP-01:
  E8:
    metric: ep01_composite_score
    op: "<"
    default_value: 30
    units: points
    label: "EP-01 composite minimum"
    kind: numeric
    recommended:
      value: 30
      rationale: >
        Phase-2 hard floor for emergency-planning composite (DRV-02).
        Norm-anchored value; the user can override via the threshold
        editor but the default mirrors the IAEA / project requirement.
      sources: ["IAEA GSR Part 7", "Project DRV-02 schema"]
    bounds: {min: 10, max: 60}

HI-02:
  A7:
    metric: nearest_seveso_km
    op: "<"
    default_value: 5
    units: km
    label: "Major-hazard storage avoidance"
    kind: numeric
    recommended:
      value: 5
      rationale: >
        Project A7: 5 km buffer from Seveso / IED facilities aligns with
        IAEA NS-G-3.1 §3.13 explosion-overpressure envelopes.
      sources: ["IAEA NS-G-3.1 §3.13", "EU Seveso III Directive"]
    bounds: {min: 2, max: 15}

HI-03:
  A8:
    metric: nearest_toxic_source_km
    op: "<"
    default_value: 8
    units: km
    label: "Hazardous cloud source avoidance"
    kind: numeric
    recommended:
      value: 8
      rationale: >
        Project A8: 8 km buffer from toxic / hazardous-cloud release
        sources reflects worst-case dispersion under Pasquill F stability.
      sources: ["IAEA NS-G-3.1 §3.27", "NUREG-0800 §2.2.3"]
    bounds: {min: 3, max: 25}

HI-06:
  A5:
    metric: nearest_military_km
    op: "<"
    default_value: 30
    units: km
    kind: numeric
    label: "Military range / practice installation separation"
    recommended:
      value: 30
      rationale: >
        Project A5: >= 30 km from practice, bombing, or firing ranges
        (SSG-35-aligned military-activity envelope).
      sources: ["IAEA SSG-35", "Project site criteria"]
    bounds: {min: 5, max: 100}
  A6:
    metric: nearest_military_km
    op: "<"
    default_value: 8
    units: km
    kind: numeric
    label: "Ammunition storage separation"
    recommended:
      value: 8
      rationale: >
        Project A6: >= 8 km from ammunition / explosive storage
        facilities.
      sources: ["Project site criteria"]
    bounds: {min: 2, max: 50}

# Band-recipe pivot codes:
# - BF-01 / B1 was retired after SP-F (BF-01 is now a non-scored basic-filter note;
#   NS-02 is the single scored grid-connection criterion).
# - BF-02 / B2 was retired after SP-F (bands now use explicit required/ideal area-per-unit
#   thresholds anchored to NuScale module count, expressed directly in the rubric YAML).
