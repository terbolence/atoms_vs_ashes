id: "oklo_aurora"
name: "Oklo Aurora (1×75 MWe — Phase 2 design)"
vendor: "Oklo Inc."
fuel_type: "HALEU metal fuel (sodium-cooled fast spectrum)"
plant_net_mwe: 75        # Phase 2 design upsized from 15–50 MWe
modules_per_plant: 1
site_area_hectares: 20   # analyst_inference — Oklo has not published a site-area figure; 20 ha bounds a 75 MWe microreactor with EPZ buffer + aux buildings + cooling envelope (locked 2026-04-21)
country_of_origin: "US"

# CONFIDENCE: analyst_inference (VERY HIGH uncertainty).
#   - Oklo public guidance: target $2,500–3,000/kWe NOAK — extreme vendor optimism.
#   - No commercial unit licensed; original Aurora COL denied Jan 2022 (NRC).
#   - Resubmission anticipated 2026; design upsized to 75 MWe.
#   - Metal-fuel HALEU supply at commercial scale does not exist.
foak_overnight_capex_usd_per_kwe:
  low: 10000
  central: 16000
  high: 22000

