  a2_fuel_supply: "fail"        # Metal HALEU fuel no commercial supply
  a3_supply_chain: "fail"
  a4_reference_pipeline: "fail" # No utility commitments; data-center MOUs only
  a5_design_freeze: "fail"      # Phase 2 design not frozen
  a6_decommissioning: "fail"    # No fuel cycle backend established
  a7_2033_cod: "fail"           # Realistic commercial COD post-2035

eligible_panel_a: false
eligible_panel_b: true   # Panel B explicitly relaxes A2 and A5
notes: |
  Phase 2 verdict: drop. Multiple Tier A failures. Included in Panel B for
  comparison only — Oklo's economics CLAIMS are very low ($30-50/MWh) but
  the engineering basis is unverified. The model uses risk-adjusted bounds.
