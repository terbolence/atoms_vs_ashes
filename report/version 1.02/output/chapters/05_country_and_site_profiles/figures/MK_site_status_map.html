<!doctype html>
<meta charset="utf-8">
<title>North Macedonia (MK) site-screening status map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
.legend span { margin-right: 1rem; font-size: 0.9rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem;
  margin-right: 0.25rem; border: 1px solid #222; vertical-align: -0.1rem; }
#map { width: 100%; height: 760px; border: 1px solid #ddd; }
.callout { font-size: 12px; line-height: 1.25; }
</style>
<h1>North Macedonia (MK) site-screening status for NuScale VOYGR-6</h1>
<p>Country context and borders are provided by OpenStreetMap tiles. Click a marker for site name, status, composite score, Monte Carlo band, and stability band.</p>
<div class="legend"><span><i style="background:#1f9d5a"></i>Full pass</span><span><i style="background:#d4a017"></i>Exclusion pass with avoidance flag</span><span><i style="background:#c0392b"></i>Hard fail</span></div>
<div id="map"></div>
<script>
const map = L.map('map').setView([41.311650, 21.597417], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const bounds = [];
bounds.push([41.058320, 21.484266]);
L.circleMarker([41.058320, 21.484266], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Bitola power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 1<br>Composite: 5.525<br>MC band: 4.101-5.939<br>Stability band: A</div>").bindTooltip("Bitola", {permanent: false, direction: 'top'});
bounds.push([41.483333, 22.100000]);
L.circleMarker([41.483333, 22.100000], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Negotino power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 2<br>Composite: 4.899<br>MC band: 3.828-5.313<br>Stability band: H</div>").bindTooltip("Negotino", {permanent: false, direction: 'top'});
bounds.push([41.582133, 21.000288]);
L.circleMarker([41.582133, 21.000288], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Oslomej power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 3<br>Composite: 4.515<br>MC band: 3.661-4.929<br>Stability band: H</div>").bindTooltip("Oslomej", {permanent: false, direction: 'top'});
bounds.push([41.122815, 21.805115]);
L.circleMarker([41.122815, 21.805115], {radius: 7, color: '#222', weight: 1, fillColor: '#c0392b', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Mariovo power station</strong><br>Status: Hard fail<br>National rank: N/A<br>Composite: N/A<br>MC band: N/A<br>Stability band: H</div>").bindTooltip("Mariovo", {permanent: false, direction: 'top'});
if (bounds.length > 0) { map.fitBounds(bounds, { padding: [30, 30] }); }
</script>
