<!doctype html>
<meta charset="utf-8">
<title>Ukraine (UA) site-screening status map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
.legend span { margin-right: 1rem; font-size: 0.9rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem;
  margin-right: 0.25rem; border: 1px solid #222; vertical-align: -0.1rem; }
#map { width: 100%; height: 760px; border: 1px solid #ddd; }
.callout { font-size: 12px; line-height: 1.25; }
</style>
<h1>Ukraine (UA) site-screening status for NuScale VOYGR-6</h1>
<p>Country context and borders are provided by OpenStreetMap tiles. Click a marker for site name, status, composite score, Monte Carlo band, and stability band.</p>
<div class="legend"><span><i style="background:#1f9d5a"></i>Full pass</span><span><i style="background:#d4a017"></i>Exclusion pass with avoidance flag</span><span><i style="background:#c0392b"></i>Hard fail</span></div>
<div id="map"></div>
<script>
const map = L.map('map').setView([49.051944, 29.688649], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const bounds = [];
bounds.push([49.586013, 36.523875]);
L.circleMarker([49.586013, 36.523875], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Zmiivska power station</strong><br>Status: Full pass<br>National rank: 1<br>Composite: 7.455<br>MC band: 6.263-7.945<br>Stability band: N/A</div>").bindTooltip("Zmiivska", {permanent: false, direction: 'top'});
bounds.push([50.214293, 24.374654]);
L.circleMarker([50.214293, 24.374654], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Dobrotvir power station</strong><br>Status: Full pass<br>National rank: 2<br>Composite: 7.372<br>MC band: 6.533-8.006<br>Stability band: N/A</div>").bindTooltip("Dobrotvir", {permanent: false, direction: 'top'});
bounds.push([48.705825, 29.218668]);
L.circleMarker([48.705825, 29.218668], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Ladyzhyn power station</strong><br>Status: Full pass<br>National rank: 3<br>Composite: 7.197<br>MC band: 6.391-7.706<br>Stability band: N/A</div>").bindTooltip("Ladyzhyn", {permanent: false, direction: 'top'});
bounds.push([47.543204, 33.659513]);
L.circleMarker([47.543204, 33.659513], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Kryvorizka power station</strong><br>Status: Full pass<br>National rank: 4<br>Composite: 7.166<br>MC band: 6.051-7.655<br>Stability band: N/A</div>").bindTooltip("Kryvorizka", {permanent: false, direction: 'top'});
bounds.push([49.210383, 24.666536]);
L.circleMarker([49.210383, 24.666536], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Burshtyn power station</strong><br>Status: Full pass<br>National rank: 5<br>Composite: 6.959<br>MC band: 6.199-7.450<br>Stability band: N/A</div>").bindTooltip("Burshtyn", {permanent: false, direction: 'top'});
if (bounds.length > 0) { map.fitBounds(bounds, { padding: [30, 30] }); }
</script>
