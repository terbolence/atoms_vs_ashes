<!doctype html>
<meta charset="utf-8">
<title>Croatia (HR) site-screening status map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
.legend span { margin-right: 1rem; font-size: 0.9rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem;
  margin-right: 0.25rem; border: 1px solid #222; vertical-align: -0.1rem; }
#map { width: 100%; height: 760px; border: 1px solid #ddd; }
.callout { font-size: 12px; line-height: 1.25; }
</style>
<h1>Croatia (HR) site-screening status for NuScale VOYGR-6</h1>
<p>Country context and borders are provided by OpenStreetMap tiles. Click a marker for site name, status, composite score, Monte Carlo band, and stability band.</p>
<div class="legend"><span><i style="background:#1f9d5a"></i>Full pass</span><span><i style="background:#d4a017"></i>Exclusion pass with avoidance flag</span><span><i style="background:#c0392b"></i>Hard fail</span></div>
<div id="map"></div>
<script>
const map = L.map('map').setView([44.093382, 15.798018], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const bounds = [];
bounds.push([45.136764, 14.162702]);
L.circleMarker([45.136764, 14.162702], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Plomin power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 1<br>Composite: 6.214<br>MC band: 5.467-6.730<br>Stability band: A<br>Avoidance flags: Coastal Flooding (NH-08)<br></div>").bindTooltip("Plomin", {permanent: false, direction: 'top'});
bounds.push([43.050000, 17.433333]);
L.circleMarker([43.050000, 17.433333], {radius: 7, color: '#222', weight: 1, fillColor: '#c0392b', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Plo\u010de power station</strong><br>Status: Hard fail<br>National rank: N/A<br>Composite: N/A<br>MC band: N/A<br>Stability band: N/A<br>Exclusionary flags: Seismic: Surface Rupture (NH-02)<br></div>").bindTooltip("Plo\u010de", {permanent: false, direction: 'top'});
if (bounds.length > 0) { map.fitBounds(bounds, { padding: [30, 30] }); }
</script>
