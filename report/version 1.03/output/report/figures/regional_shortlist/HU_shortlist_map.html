<!doctype html>
<meta charset="utf-8">
<title>Hungary (HU) site-screening status map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
.legend span { margin-right: 1rem; font-size: 0.9rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem;
  margin-right: 0.25rem; border: 1px solid #222; vertical-align: -0.1rem; }
#map { width: 100%; height: 760px; border: 1px solid #ddd; }
.callout { font-size: 12px; line-height: 1.25; }
</style>
<h1>Hungary (HU) site-screening status for NuScale VOYGR-6</h1>
<p>Country context and borders are provided by OpenStreetMap tiles. Click a marker for site name, status, composite score, Monte Carlo band, and stability band.</p>
<div class="legend"><span><i style="background:#1f9d5a"></i>Full pass</span><span><i style="background:#d4a017"></i>Exclusion pass with avoidance flag</span><span><i style="background:#c0392b"></i>Hard fail</span></div>
<div id="map"></div>
<script>
const map = L.map('map').setView([47.414099, 19.459630], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const bounds = [];
bounds.push([45.995930, 18.679850]);
L.circleMarker([45.995930, 18.679850], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Mohacs power station</strong><br>Status: Full pass<br>National rank: 1<br>Composite: 7.584<br>MC band: 6.705-8.075<br>Stability band: A</div>").bindTooltip("Mohacs", {permanent: false, direction: 'top'});
bounds.push([47.904814, 21.055306]);
L.circleMarker([47.904814, 21.055306], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Borsod power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 2<br>Composite: 6.941<br>MC band: 6.184-7.381<br>Stability band: D</div>").bindTooltip("Borsod", {permanent: false, direction: 'top'});
bounds.push([47.236260, 16.537060]);
L.circleMarker([47.236260, 16.537060], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Torony power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 3<br>Composite: 6.872<br>MC band: 5.972-7.336<br>Stability band: D</div>").bindTooltip("Torony", {permanent: false, direction: 'top'});
bounds.push([47.916826, 21.075933]);
L.circleMarker([47.916826, 21.075933], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Tiszapalkonya power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 4<br>Composite: 6.778<br>MC band: 6.053-7.319<br>Stability band: H</div>").bindTooltip("Tiszapalkonya", {permanent: false, direction: 'top'});
bounds.push([48.016667, 19.950000]);
L.circleMarker([48.016667, 19.950000], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Matraterenye power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 5<br>Composite: 6.641<br>MC band: 5.795-7.158<br>Stability band: H</div>").bindTooltip("Matraterenye", {permanent: false, direction: 'top'});
if (bounds.length > 0) { map.fitBounds(bounds, { padding: [30, 30] }); }
</script>
