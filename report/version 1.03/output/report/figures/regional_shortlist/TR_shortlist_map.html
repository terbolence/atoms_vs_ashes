<!doctype html>
<meta charset="utf-8">
<title>Türkiye (TR) site-screening status map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
.legend span { margin-right: 1rem; font-size: 0.9rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem;
  margin-right: 0.25rem; border: 1px solid #222; vertical-align: -0.1rem; }
#map { width: 100%; height: 760px; border: 1px solid #ddd; }
.callout { font-size: 12px; line-height: 1.25; }
</style>
<h1>Türkiye (TR) site-screening status for NuScale VOYGR-6</h1>
<p>Country context and borders are provided by OpenStreetMap tiles. Click a marker for site name, status, composite score, Monte Carlo band, and stability band.</p>
<div class="legend"><span><i style="background:#1f9d5a"></i>Full pass</span><span><i style="background:#d4a017"></i>Exclusion pass with avoidance flag</span><span><i style="background:#c0392b"></i>Hard fail</span></div>
<div id="map"></div>
<script>
const map = L.map('map').setView([39.048961, 32.428027], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const bounds = [];
bounds.push([37.614187, 33.591193]);
L.circleMarker([37.614187, 33.591193], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Konya Karap\u0131nar power station</strong><br>Status: Full pass<br>National rank: 1<br>Composite: 7.784<br>MC band: 6.528-8.301<br>Stability band: A</div>").bindTooltip("Konya Karap\u0131nar", {permanent: false, direction: 'top'});
bounds.push([41.632000, 27.030000]);
L.circleMarker([41.632000, 27.030000], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Eren-1 power station</strong><br>Status: Full pass<br>National rank: 2<br>Composite: 7.459<br>MC band: 6.604-7.900<br>Stability band: A</div>").bindTooltip("Eren-1", {permanent: false, direction: 'top'});
bounds.push([38.185620, 36.269940]);
L.circleMarker([38.185620, 36.269940], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Tufanbeyli power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 3<br>Composite: 7.380<br>MC band: 6.407-7.890<br>Stability band: A</div>").bindTooltip("Tufanbeyli", {permanent: false, direction: 'top'});
bounds.push([37.716000, 33.554000]);
L.circleMarker([37.716000, 33.554000], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Karapinar Konya \u015eeker power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 4<br>Composite: 7.354<br>MC band: 6.386-7.864<br>Stability band: A</div>").bindTooltip("Karapinar Konya \u015eeker", {permanent: false, direction: 'top'});
bounds.push([40.097000, 31.695000]);
L.circleMarker([40.097000, 31.695000], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>\u00c7ay\u0131rhan power station</strong><br>Status: Full pass<br>National rank: 5<br>Composite: 7.347<br>MC band: 6.513-7.806<br>Stability band: B</div>").bindTooltip("\u00c7ay\u0131rhan", {permanent: false, direction: 'top'});
if (bounds.length > 0) { map.fitBounds(bounds, { padding: [30, 30] }); }
</script>
