<!doctype html>
<meta charset="utf-8">
<title>Poland (PL) site-screening status map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
.legend span { margin-right: 1rem; font-size: 0.9rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem;
  margin-right: 0.25rem; border: 1px solid #222; vertical-align: -0.1rem; }
#map { width: 100%; height: 760px; border: 1px solid #ddd; }
.callout { font-size: 12px; line-height: 1.25; }
</style>
<h1>Poland (PL) site-screening status for NuScale VOYGR-6</h1>
<p>Country context and borders are provided by OpenStreetMap tiles. Click a marker for site name, status, composite score, Monte Carlo band, and stability band.</p>
<div class="legend"><span><i style="background:#1f9d5a"></i>Full pass</span><span><i style="background:#d4a017"></i>Exclusion pass with avoidance flag</span><span><i style="background:#c0392b"></i>Hard fail</span></div>
<div id="map"></div>
<script>
const map = L.map('map').setView([51.742349, 18.310060], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const bounds = [];
bounds.push([50.437685, 21.337690]);
L.circleMarker([50.437685, 21.337690], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Polaniec power station</strong><br>Status: Full pass<br>National rank: 1<br>Composite: 7.684<br>MC band: 6.785-8.219<br>Stability band: A</div>").bindTooltip("Polaniec", {permanent: false, direction: 'top'});
bounds.push([53.962892, 18.711758]);
L.circleMarker([53.962892, 18.711758], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>P\u00f3lnoc power station</strong><br>Status: Full pass<br>National rank: 2<br>Composite: 7.284<br>MC band: 6.462-7.869<br>Stability band: A</div>").bindTooltip("P\u00f3lnoc", {permanent: false, direction: 'top'});
bounds.push([52.012307, 18.546212]);
L.circleMarker([52.012307, 18.546212], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Adamow power station</strong><br>Status: Full pass<br>National rank: 3<br>Composite: 7.227<br>MC band: 6.245-7.822<br>Stability band: B</div>").bindTooltip("Adamow", {permanent: false, direction: 'top'});
bounds.push([51.948982, 14.728458]);
L.circleMarker([51.948982, 14.728458], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Gubin Power Project</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 4<br>Composite: 7.222<br>MC band: 6.412-7.803<br>Stability band: B</div>").bindTooltip("Gubin Power Project", {permanent: false, direction: 'top'});
bounds.push([50.349880, 18.226184]);
L.circleMarker([50.349880, 18.226184], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Kedzierzyn CCS Project</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 5<br>Composite: 7.191<br>MC band: 6.386-7.737<br>Stability band: C</div>").bindTooltip("Kedzierzyn CCS Project", {permanent: false, direction: 'top'});
if (bounds.length > 0) { map.fitBounds(bounds, { padding: [30, 30] }); }
</script>
