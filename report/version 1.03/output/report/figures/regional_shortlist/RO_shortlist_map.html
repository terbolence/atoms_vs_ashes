<!doctype html>
<meta charset="utf-8">
<title>Romania (RO) site-screening status map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; }
.legend span { margin-right: 1rem; font-size: 0.9rem; }
.legend i { display: inline-block; width: 0.8rem; height: 0.8rem;
  margin-right: 0.25rem; border: 1px solid #222; vertical-align: -0.1rem; }
#map { width: 100%; height: 760px; border: 1px solid #ddd; }
.callout { font-size: 12px; line-height: 1.25; }
</style>
<h1>Romania (RO) site-screening status for NuScale VOYGR-6</h1>
<p>Country context and borders are provided by OpenStreetMap tiles. Click a marker for site name, status, composite score, Monte Carlo band, and stability band.</p>
<div class="legend"><span><i style="background:#1f9d5a"></i>Full pass</span><span><i style="background:#d4a017"></i>Exclusion pass with avoidance flag</span><span><i style="background:#c0392b"></i>Hard fail</span></div>
<div id="map"></div>
<script>
const map = L.map('map').setView([45.425176, 24.295069], 7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const bounds = [];
bounds.push([44.669722, 23.407778]);
L.circleMarker([44.669722, 23.407778], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Turceni power station</strong><br>Status: Full pass<br>National rank: 1<br>Composite: 7.816<br>MC band: 6.891-8.256<br>Stability band: A</div>").bindTooltip("Turceni", {permanent: false, direction: 'top'});
bounds.push([44.910633, 23.134754]);
L.circleMarker([44.910633, 23.134754], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Rovinari power station</strong><br>Status: Full pass<br>National rank: 2<br>Composite: 7.159<br>MC band: 6.361-7.700<br>Stability band: B</div>").bindTooltip("Rovinari", {permanent: false, direction: 'top'});
bounds.push([46.467700, 24.183300]);
L.circleMarker([46.467700, 24.183300], {radius: 7, color: '#222', weight: 1, fillColor: '#1f9d5a', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Iernut power station</strong><br>Status: Full pass<br>National rank: 3<br>Composite: 7.114<br>MC band: 5.285-7.555<br>Stability band: D</div>").bindTooltip("Iernut", {permanent: false, direction: 'top'});
bounds.push([45.912791, 22.826129]);
L.circleMarker([45.912791, 22.826129], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Mintia-Deva power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 4<br>Composite: 7.016<br>MC band: 6.245-7.487<br>Stability band: D</div>").bindTooltip("Mintia-Deva", {permanent: false, direction: 'top'});
bounds.push([45.165033, 27.923383]);
L.circleMarker([45.165033, 27.923383], {radius: 7, color: '#222', weight: 1, fillColor: '#d4a017', fillOpacity: 0.9}).addTo(map).bindPopup("<div class='callout'><strong>Braila power station</strong><br>Status: Exclusion pass with avoidance flag<br>National rank: 5<br>Composite: 6.784<br>MC band: 6.058-7.275<br>Stability band: D</div>").bindTooltip("Braila", {permanent: false, direction: 'top'});
if (bounds.length > 0) { map.fitBounds(bounds, { padding: [30, 30] }); }
</script>
