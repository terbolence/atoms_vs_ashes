services:
  db:
    image: postgis/postgis:16-3.4
    container_name: atoms_vs_ashes_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atoms_vs_ashes}
      POSTGRES_USER: ${POSTGRES_USER:-atoms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atoms} -d ${POSTGRES_DB:-atoms_vs_ashes}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
